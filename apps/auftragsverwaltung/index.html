<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragsverwaltung – Handwerk, Transport &amp; Umzug</title>
<style>
  :root {
    --blau: #1d5c8f;
    --blau-dunkel: #14415f;
    --grau-hell: #f4f6f8;
    --grau: #e2e7ec;
    --text: #22303c;
    --text-leise: #64748b;
    --gruen: #1e7d46;
    --gelb: #b45309;
    --rot: #b91c1c;
    --radius: 10px;
    --schatten: 0 1px 3px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--grau-hell);
    color: var(--text);
    font-size: 16px;
    line-height: 1.45;
  }

  /* ---------- Kopf & Navigation ---------- */
  header {
    background: var(--blau);
    color: #fff;
    padding: 14px 16px 0;
  }
  header h1 { margin: 0 0 10px; font-size: 1.25rem; font-weight: 600; }
  header h1 small { font-weight: 400; opacity: .8; font-size: .85rem; margin-left: 8px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button {
    background: transparent; border: none; color: rgba(255,255,255,.85);
    padding: 10px 16px; font-size: .95rem; cursor: pointer;
    border-radius: 8px 8px 0 0; white-space: nowrap;
  }
  nav button.aktiv { background: var(--grau-hell); color: var(--text); font-weight: 600; }

  main { max-width: 960px; margin: 0 auto; padding: 16px; }

  /* ---------- Bausteine ---------- */
  .karte {
    background: #fff; border-radius: var(--radius); box-shadow: var(--schatten);
    padding: 16px; margin-bottom: 12px;
  }
  .karte h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .zeile { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .waechst { flex: 1; min-width: 160px; }

  .kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kachel {
    background: #fff; border-radius: var(--radius); box-shadow: var(--schatten);
    padding: 14px; cursor: pointer; border: none; text-align: left; font: inherit;
  }
  .kachel .zahl { font-size: 1.7rem; font-weight: 700; color: var(--blau); }
  .kachel .beschriftung { color: var(--text-leise); font-size: .85rem; }
  .kachel.warn .zahl { color: var(--gelb); }

  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: .78rem; font-weight: 600; white-space: nowrap;
  }
  .badge.anfrage   { background: #e0e7ff; color: #3730a3; }
  .badge.angebot   { background: #fef3c7; color: #92400e; }
  .badge.beauftragt{ background: #cffafe; color: #155e75; }
  .badge.in_arbeit { background: #dbeafe; color: #1e40af; }
  .badge.fertig    { background: #fee2e2; color: #991b1b; }
  .badge.bezahlt   { background: #dcfce7; color: #166534; }

  button.primaer, button.sekundaer, button.gefahr {
    border: none; border-radius: 8px; padding: 10px 16px;
    font-size: .95rem; cursor: pointer; font-weight: 600;
  }
  button.primaer { background: var(--blau); color: #fff; }
  button.primaer:hover { background: var(--blau-dunkel); }
  button.sekundaer { background: var(--grau); color: var(--text); }
  button.gefahr { background: #fff; color: var(--rot); border: 1px solid var(--rot); }
  button.klein { padding: 6px 10px; font-size: .82rem; }

  input, select, textarea {
    font: inherit; padding: 9px 10px; border: 1px solid #cbd5e1;
    border-radius: 8px; width: 100%; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 70px; }
  label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-leise); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }

  .filterleiste { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .filterleiste button {
    border: 1px solid var(--grau); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: .82rem; cursor: pointer; color: var(--text-leise);
  }
  .filterleiste button.aktiv { background: var(--blau); border-color: var(--blau); color: #fff; }

  .listenkarte {
    background: #fff; border-radius: var(--radius); box-shadow: var(--schatten);
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    border: none; width: 100%; text-align: left; font: inherit;
  }
  .listenkarte:hover { outline: 2px solid var(--blau); outline-offset: -2px; }
  .listenkarte .titel { font-weight: 600; }
  .listenkarte .unterzeile { color: var(--text-leise); font-size: .85rem; margin-top: 2px; }
  .listenkarte .rechts { text-align: right; flex-shrink: 0; }
  .listenkarte .summe { font-weight: 700; margin-top: 4px; }

  .leer { text-align: center; color: var(--text-leise); padding: 32px 16px; }

  /* ---------- Positions-Tabelle ---------- */
  table.positionen { width: 100%; border-collapse: collapse; }
  table.positionen th { text-align: left; font-size: .78rem; color: var(--text-leise); padding: 4px 6px 4px 0; }
  table.positionen td { padding: 3px 6px 3px 0; vertical-align: middle; }
  table.positionen input { padding: 7px 8px; }
  table.positionen .sp-menge  { width: 70px; }
  table.positionen .sp-einheit{ width: 78px; }
  table.positionen .sp-preis  { width: 100px; }
  table.positionen .sp-summe  { width: 90px; text-align: right; font-size: .9rem; white-space: nowrap; }
  table.positionen .sp-loeschen { width: 34px; }
  .pos-loeschen {
    border: none; background: transparent; color: var(--rot);
    font-size: 1.1rem; cursor: pointer; padding: 4px;
  }
  .summenblock { text-align: right; margin-top: 10px; font-size: .95rem; }
  .summenblock .brutto { font-size: 1.15rem; font-weight: 700; }

  /* ---------- Dialog ---------- */
  dialog {
    border: none; border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,.25);
    padding: 0; width: min(680px, calc(100vw - 24px));
    max-height: calc(100vh - 40px);
  }
  dialog::backdrop { background: rgba(15,23,42,.45); }
  .dialog-kopf {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--grau);
    position: sticky; top: 0; background: #fff; z-index: 2;
  }
  .dialog-kopf h2 { margin: 0; font-size: 1.05rem; }
  .dialog-kopf .schliessen { border: none; background: transparent; font-size: 1.4rem; cursor: pointer; color: var(--text-leise); }
  .dialog-inhalt { padding: 16px 18px; }
  .dialog-fuss {
    display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap;
    padding: 12px 18px; border-top: 1px solid var(--grau);
    position: sticky; bottom: 0; background: #fff;
  }
  .dialog-fuss .rechtsgruppe { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  .feldpaar { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .feldpaar { grid-template-columns: 1fr; } }

  .hinweis { font-size: .82rem; color: var(--text-leise); margin-top: 6px; }

  /* ---------- Synchronisierung ---------- */
  .sync-badge {
    float: right; font-size: .72rem; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; background: rgba(255,255,255,.15); color: #fff;
    margin-top: 2px;
  }
  .sync-badge.gruen { background: #14532d; }
  .sync-badge.gelb { background: #92400e; }

  /* ---------- Fotos ---------- */
  .fotogitter { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .fotokachel { position: relative; }
  .fotokachel img {
    width: 92px; height: 92px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--grau); cursor: pointer; background: var(--grau-hell);
  }
  .fotokachel .foto-loeschen {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
    border-radius: 50%; border: none; background: var(--rot); color: #fff;
    font-size: .8rem; cursor: pointer; line-height: 1;
  }
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.88); align-items: center; justify-content: center; cursor: zoom-out;
  }
  #lightbox.offen { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 96vh; border-radius: 6px; }

  /* ---------- Notiz-Assistent ---------- */
  .vorschau-tabelle { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .vorschau-tabelle th { text-align: left; color: var(--text-leise); font-size: .78rem; padding: 4px 6px 4px 0; }
  .vorschau-tabelle td { padding: 4px 6px 4px 0; border-top: 1px solid var(--grau); }

  /* ---------- Druck (Angebot / Rechnung) ---------- */
  #druckbereich { display: none; }
  @media print {
    body > *:not(#druckbereich) { display: none !important; }
    #druckbereich { display: block; }
    body { background: #fff; }
  }
  #druckbereich { font-size: 13px; color: #000; padding: 10mm; }
  #druckbereich .d-kopf { display: flex; justify-content: space-between; margin-bottom: 28px; }
  #druckbereich .d-firma { text-align: right; font-size: 12px; line-height: 1.5; }
  #druckbereich .d-firma strong { font-size: 15px; }
  #druckbereich .d-absenderzeile { font-size: 9px; text-decoration: underline; margin-bottom: 6px; }
  #druckbereich h1 { font-size: 19px; margin: 24px 0 4px; }
  #druckbereich .d-meta { font-size: 12px; color: #333; margin-bottom: 18px; }
  #druckbereich table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  #druckbereich th { text-align: left; border-bottom: 1.5px solid #000; padding: 6px 4px; font-size: 12px; }
  #druckbereich td { padding: 6px 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
  #druckbereich .d-rechts { text-align: right; white-space: nowrap; }
  #druckbereich .d-summen { margin-left: auto; width: 260px; }
  #druckbereich .d-summen td { border: none; padding: 3px 4px; }
  #druckbereich .d-summen .d-brutto td { border-top: 1.5px solid #000; font-weight: 700; font-size: 14px; }
  #druckbereich .d-fuss { margin-top: 32px; font-size: 11px; color: #333; line-height: 1.6; border-top: 1px solid #999; padding-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>🛠️ Auftragsverwaltung <small id="kopf-firma"></small><span class="sync-badge" id="sync-badge"></span></h1>
  <nav id="hauptnav"></nav>
</header>

<main id="inhalt"></main>

<dialog id="dialog"></dialog>
<dialog id="dialog2"></dialog>
<div id="lightbox" onclick="this.classList.remove('offen')"><img id="lightbox-bild" alt="Foto in Großansicht"></div>
<div id="druckbereich"></div>

<script>
"use strict";

/* =========================================================
   Datenhaltung – alles liegt lokal im Browser (localStorage)
   ========================================================= */
const SPEICHER_SCHLUESSEL = "maler-auftragsverwaltung-v1";

const STATUS = [
  { id: "anfrage",    name: "Anfrage" },
  { id: "angebot",    name: "Angebot erstellt" },
  { id: "beauftragt", name: "Beauftragt" },
  { id: "in_arbeit",  name: "In Arbeit" },
  { id: "fertig",     name: "Fertig – Rechnung offen" },
  { id: "bezahlt",    name: "Bezahlt" },
];
const EINHEITEN = ["m²", "m³", "lfm", "Std.", "Stk.", "km", "kg", "Karton", "Fahrt", "Tag", "Liter", "pausch."];

// Branchen-Vorlagen: füllen auf Wunsch die Preisliste in den Einstellungen
const BRANCHEN = {
  maler: { name: "Maler / Lackierer", preisliste: [
    { begriff: "streichen", einheit: "m²", preis: 12.5 },
    { begriff: "spachteln", einheit: "m²", preis: 8 },
    { begriff: "grundieren", einheit: "m²", preis: 4.5 },
    { begriff: "tapezieren", einheit: "m²", preis: 14 },
    { begriff: "lackieren", einheit: "lfm", preis: 18 },
    { begriff: "abkleben", einheit: "pausch.", preis: 90 },
  ]},
  elektro: { name: "Elektro", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 65 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 45 },
    { begriff: "steckdose", einheit: "Stk.", preis: 35 },
    { begriff: "schalter", einheit: "Stk.", preis: 35 },
    { begriff: "leuchte", einheit: "Stk.", preis: 45 },
    { begriff: "leitung", einheit: "lfm", preis: 12 },
  ]},
  sanitaer: { name: "Sanitär / Heizung", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 75 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 49 },
    { begriff: "wc", einheit: "Stk.", preis: 180 },
    { begriff: "waschbecken", einheit: "Stk.", preis: 150 },
    { begriff: "armatur", einheit: "Stk.", preis: 95 },
    { begriff: "rohr", einheit: "lfm", preis: 28 },
  ]},
  garten: { name: "Garten / Landschaft", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 55 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 35 },
    { begriff: "hecke", einheit: "lfm", preis: 8 },
    { begriff: "rasen", einheit: "m²", preis: 0.5 },
    { begriff: "entsorgung", einheit: "m³", preis: 45 },
  ]},
  transport: { name: "Transport & Umzug", preisliste: [
    { begriff: "helfer", einheit: "Std.", preis: 38 },
    { begriff: "träger", einheit: "Std.", preis: 38 },
    { begriff: "fahrer", einheit: "Std.", preis: 45 },
    { begriff: "lkw", einheit: "Tag", preis: 280 },
    { begriff: "transporter", einheit: "Tag", preis: 120 },
    { begriff: "km", einheit: "km", preis: 1.2 },
    { begriff: "karton", einheit: "Karton", preis: 2.5 },
    { begriff: "halteverbot", einheit: "pausch.", preis: 120 },
    { begriff: "klavier", einheit: "pausch.", preis: 250 },
    { begriff: "möbel", einheit: "Std.", preis: 40 },
  ]},
  allgemein: { name: "Allgemein / Sonstiges", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 60 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 40 },
    { begriff: "entsorgung", einheit: "m³", preis: 45 },
  ]},
};

let daten = ladeDaten();

function leererZustand() {
  return {
    einstellungen: {
      firma: "", inhaber: "", strasse: "", plzOrt: "", telefon: "", email: "",
      iban: "", steuernummer: "", mwst: 19, kleinunternehmer: false,
      stundensatz: 55, zahlungsziel: 14, naechsteNummer: 1,
      branche: "allgemein",
      preisliste: [
        { begriff: "arbeitsstunde", einheit: "Std.", preis: 60 },
        { begriff: "anfahrt", einheit: "pausch.", preis: 40 },
        { begriff: "entsorgung", einheit: "m³", preis: 45 },
      ],
    },
    stand: "",
    kunden: [],
    auftraege: [],
  };
}

function ladeDaten() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (!roh) return leererZustand();
    const geparst = JSON.parse(roh);
    // fehlende Felder aus Vorversionen auffüllen
    return Object.assign(leererZustand(), geparst, {
      einstellungen: Object.assign(leererZustand().einstellungen, geparst.einstellungen || {}),
    });
  } catch (e) {
    console.error("Daten konnten nicht geladen werden:", e);
    return leererZustand();
  }
}

function speichern() {
  daten.stand = new Date().toISOString();
  localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
  planeSync();
}

/* ---------- Synchronisierung mit dem PC-Programm (server.js) ----------
   Wird die App über http://<PC>:8722 geöffnet, ist der PC die führende
   Ablage: Änderungen werden dorthin geschrieben; ist er gerade nicht
   erreichbar (unterwegs beim Kunden), bleibt alles lokal gespeichert
   und wird nachgereicht, sobald das Heimnetz wieder da ist.          */
const SERVER_MOEGLICH = location.protocol === "http:" || location.protocol === "https:";
const SYNC_FLAG = SPEICHER_SCHLUESSEL + ":ausstehend";
let serverAktiv = false;
let syncAusstehend = localStorage.getItem(SYNC_FLAG) === "1";
let syncTimer = null;
let syncLaeuft = false;

function syncAnzeige() {
  const el = document.getElementById("sync-badge");
  if (!el) return;
  if (!SERVER_MOEGLICH) { el.textContent = ""; el.className = "sync-badge"; el.style.display = "none"; return; }
  el.style.display = "";
  if (serverAktiv && !syncAusstehend) { el.textContent = "✓ Mit PC synchron"; el.className = "sync-badge gruen"; }
  else if (syncAusstehend) { el.textContent = "⏳ Wird übertragen, sobald der PC erreichbar ist"; el.className = "sync-badge gelb"; }
  else { el.textContent = "PC nicht erreichbar – Daten bleiben lokal"; el.className = "sync-badge gelb"; }
}

function planeSync() {
  if (!SERVER_MOEGLICH) return;
  syncAusstehend = true;
  localStorage.setItem(SYNC_FLAG, "1");
  syncAnzeige();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncJetzt, 400);
}

async function syncJetzt() {
  if (!SERVER_MOEGLICH || syncLaeuft) return;
  syncLaeuft = true;
  try {
    const antwort = await fetch("api/daten", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(daten),
    });
    if (!antwort.ok) throw new Error("Serverantwort " + antwort.status);
    serverAktiv = true;
    syncAusstehend = false;
    localStorage.removeItem(SYNC_FLAG);
    fotoSync();
  } catch {
    serverAktiv = false;
  } finally {
    syncLaeuft = false;
    syncAnzeige();
  }
}

// Regelmäßiger Abgleich: eigene Änderungen nachschieben bzw. neuere
// Stände vom PC übernehmen (z. B. wenn dort weitergearbeitet wurde).
async function syncAbgleich() {
  if (!SERVER_MOEGLICH || syncLaeuft) return;
  if (syncAusstehend) { syncJetzt(); return; }
  try {
    const antwort = await fetch("api/daten", { cache: "no-store" });
    if (!antwort.ok) throw new Error("Serverantwort " + antwort.status);
    serverAktiv = true;
    const serverDaten = await antwort.json();
    if (serverDaten && serverDaten.stand && serverDaten.stand > (daten.stand || "")) {
      daten = Object.assign(leererZustand(), serverDaten, {
        einstellungen: Object.assign(leererZustand().einstellungen, serverDaten.einstellungen || {}),
      });
      localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
      if (!dialog.open && !dialog2.open) render();
    }
    fotoSync();
  } catch {
    serverAktiv = false;
  }
  syncAnzeige();
}

async function syncStart() {
  if (!SERVER_MOEGLICH) { syncAnzeige(); return; }
  await syncAbgleich();
  // Erststart am Server: lokale Daten hochladen, falls dort noch nichts liegt
  if (serverAktiv && (daten.kunden.length || daten.auftraege.length) && !syncAusstehend) {
    try {
      const antwort = await fetch("api/daten", { cache: "no-store" });
      if (antwort.ok && (await antwort.json()) === null) planeSync();
    } catch { /* nächster Abgleich versucht es erneut */ }
  }
  setInterval(syncAbgleich, 20000);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---------- Hilfsfunktionen ---------- */
const euro = (n) => (isFinite(n) ? n : 0).toLocaleString("de-DE", { style: "currency", currency: "EUR" });

function datumFormat(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
}

function heuteISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function statusName(id) {
  const s = STATUS.find((x) => x.id === id);
  return s ? s.name : id;
}

function kunde(id) {
  return daten.kunden.find((k) => k.id === id) || null;
}

function auftragNetto(a) {
  return (a.positionen || []).reduce((s, p) => s + (Number(p.menge) || 0) * (Number(p.preis) || 0), 0);
}

function auftragBrutto(a) {
  const netto = auftragNetto(a);
  if (daten.einstellungen.kleinunternehmer) return netto;
  return netto * (1 + (Number(daten.einstellungen.mwst) || 0) / 100);
}

function neueDokumentNummer() {
  const jahr = new Date().getFullYear();
  const nr = daten.einstellungen.naechsteNummer || 1;
  daten.einstellungen.naechsteNummer = nr + 1;
  return jahr + "-" + String(nr).padStart(3, "0");
}

/* =========================================================
   Navigation & Rendern
   ========================================================= */
const ANSICHTEN = [
  { id: "uebersicht", name: "Übersicht" },
  { id: "auftraege",  name: "Aufträge" },
  { id: "kunden",     name: "Kunden" },
  { id: "einstellungen", name: "Einstellungen" },
];
let aktiveAnsicht = "uebersicht";
let auftragsFilter = "offen"; // offen | alle | einzelne Status-IDs
let auftragsSuche = "";
let kundenSuche = "";

function zeige(ansicht) {
  aktiveAnsicht = ansicht;
  render();
}

function render() {
  document.getElementById("kopf-firma").textContent = daten.einstellungen.firma || "";
  document.getElementById("hauptnav").innerHTML = ANSICHTEN.map((a) =>
    `<button class="${a.id === aktiveAnsicht ? "aktiv" : ""}" onclick="zeige('${a.id}')">${a.name}</button>`
  ).join("");

  const inhalt = document.getElementById("inhalt");
  if (aktiveAnsicht === "uebersicht") inhalt.innerHTML = renderUebersicht();
  else if (aktiveAnsicht === "auftraege") inhalt.innerHTML = renderAuftraege();
  else if (aktiveAnsicht === "kunden") inhalt.innerHTML = renderKunden();
  else inhalt.innerHTML = renderEinstellungen();
}

/* ---------- Übersicht ---------- */
function renderUebersicht() {
  const a = daten.auftraege;
  const anzahl = (ids) => a.filter((x) => ids.includes(x.status)).length;
  const offeneRechnungen = a.filter((x) => x.status === "fertig");
  const offenerBetrag = offeneRechnungen.reduce((s, x) => s + auftragBrutto(x), 0);

  const heute = heuteISO();
  const termine = a
    .filter((x) => x.termin && x.termin >= heute && !["bezahlt"].includes(x.status))
    .sort((x, y) => x.termin.localeCompare(y.termin))
    .slice(0, 6);

  const zuletzt = [...a].sort((x, y) => (y.geaendertAm || "").localeCompare(x.geaendertAm || "")).slice(0, 5);

  let html = `
  <div class="kacheln">
    <button class="kachel" onclick="filterUndZeige('anfrage')"><div class="zahl">${anzahl(["anfrage", "angebot"])}</div><div class="beschriftung">Offene Anfragen / Angebote</div></button>
    <button class="kachel" onclick="filterUndZeige('beauftragt')"><div class="zahl">${anzahl(["beauftragt"])}</div><div class="beschriftung">Beauftragt / geplant</div></button>
    <button class="kachel" onclick="filterUndZeige('in_arbeit')"><div class="zahl">${anzahl(["in_arbeit"])}</div><div class="beschriftung">In Arbeit</div></button>
    <button class="kachel warn" onclick="filterUndZeige('fertig')"><div class="zahl">${euro(offenerBetrag)}</div><div class="beschriftung">Offene Rechnungen (${offeneRechnungen.length})</div></button>
  </div>

  <div class="zeile" style="margin-bottom:16px">
    <button class="primaer" onclick="auftragBearbeiten()">+ Neuer Auftrag</button>
    <button class="sekundaer" onclick="kundeBearbeiten()">+ Neuer Kunde</button>
  </div>

  <div class="karte">
    <h2>📅 Nächste Termine</h2>`;

  if (termine.length === 0) {
    html += `<div class="leer">Keine anstehenden Termine. Trage bei einem Auftrag einen Termin ein.</div>`;
  } else {
    html += termine.map((x) => auftragskarte(x, true)).join("");
  }
  html += `</div>

  <div class="karte">
    <h2>🕘 Zuletzt bearbeitet</h2>`;
  html += zuletzt.length === 0
    ? `<div class="leer">Noch keine Aufträge. Leg mit „+ Neuer Auftrag“ los${daten.kunden.length === 0 ? " – oder <a href=\"#\" onclick=\"beispieldatenLaden();return false\">Beispieldaten laden</a>, um dich umzusehen" : ""}.</div>`
    : zuletzt.map((x) => auftragskarte(x)).join("");
  html += `</div>`;
  return html;
}

function filterUndZeige(status) {
  auftragsFilter = status;
  zeige("auftraege");
}

/* ---------- Aufträge ---------- */
function auftragskarte(a, mitTermin) {
  const k = kunde(a.kundeId);
  const summe = auftragBrutto(a);
  return `
  <button class="listenkarte" onclick="auftragBearbeiten('${a.id}')">
    <div>
      <div class="titel">${esc(a.titel) || "(ohne Titel)"}</div>
      <div class="unterzeile">${k ? esc(k.name) : "Kein Kunde"}${a.termin ? " · " + datumFormat(a.termin) : ""}</div>
    </div>
    <div class="rechts">
      <span class="badge ${a.status}">${statusName(a.status)}</span>
      ${summe > 0 ? `<div class="summe">${euro(summe)}</div>` : ""}
    </div>
  </button>`;
}

function gefilterteAuftraege() {
  let liste = daten.auftraege.filter((a) => {
    if (auftragsFilter === "offen") { if (a.status === "bezahlt") return false; }
    else if (auftragsFilter !== "alle" && a.status !== auftragsFilter) return false;
    if (auftragsSuche) {
      const k = kunde(a.kundeId);
      const heuhaufen = (a.titel + " " + (a.beschreibung || "") + " " + (k ? k.name : "")).toLowerCase();
      if (!heuhaufen.includes(auftragsSuche.toLowerCase())) return false;
    }
    return true;
  });
  const reihenfolge = Object.fromEntries(STATUS.map((s, i) => [s.id, i]));
  liste.sort((a, b) => (reihenfolge[a.status] - reihenfolge[b.status]) || (a.termin || "9999").localeCompare(b.termin || "9999"));
  return liste;
}

function auftragslisteHtml() {
  const liste = gefilterteAuftraege();
  return liste.length === 0
    ? `<div class="leer karte">Keine Aufträge in dieser Ansicht.</div>`
    : liste.map((a) => auftragskarte(a)).join("");
}

function renderAuftraege() {
  const filter = [
    { id: "offen", name: "Alle offenen" },
    ...STATUS,
    { id: "alle", name: "Alle" },
  ];
  return `
  <div class="zeile" style="margin-bottom:8px">
    <input class="waechst" type="search" placeholder="Suchen (Titel, Kunde, Beschreibung)…" value="${esc(auftragsSuche)}"
      oninput="auftragsSuche=this.value; document.getElementById('auftragsliste').innerHTML=auftragslisteHtml()">
    <button class="primaer" onclick="auftragBearbeiten()">+ Neuer Auftrag</button>
  </div>
  <div class="filterleiste">
    ${filter.map((f) => `<button class="${auftragsFilter === f.id ? "aktiv" : ""}" onclick="auftragsFilter='${f.id}';render()">${f.name}</button>`).join("")}
  </div>
  <div id="auftragsliste">${auftragslisteHtml()}</div>`;
}

/* ---------- Kunden ---------- */
function kundenlisteHtml() {
  let liste = daten.kunden.filter((k) => {
    if (!kundenSuche) return true;
    return (k.name + " " + (k.plzOrt || "") + " " + (k.telefon || "")).toLowerCase().includes(kundenSuche.toLowerCase());
  });
  liste.sort((a, b) => a.name.localeCompare(b.name, "de"));
  if (liste.length === 0) return `<div class="leer karte">Noch keine Kunden angelegt bzw. keine Treffer.</div>`;
  return liste.map((k) => {
    const anzahl = daten.auftraege.filter((a) => a.kundeId === k.id).length;
    return `
    <button class="listenkarte" onclick="kundeBearbeiten('${k.id}')">
      <div>
        <div class="titel">${esc(k.name)}</div>
        <div class="unterzeile">${esc([k.plzOrt, k.telefon].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="rechts unterzeile">${anzahl} Auftr${anzahl === 1 ? "ag" : "äge"}</div>
    </button>`;
  }).join("");
}

function renderKunden() {
  return `
  <div class="zeile" style="margin-bottom:12px">
    <input class="waechst" type="search" placeholder="Kunden suchen…" value="${esc(kundenSuche)}"
      oninput="kundenSuche=this.value; document.getElementById('kundenliste').innerHTML=kundenlisteHtml()">
    <button class="primaer" onclick="kundeBearbeiten()">+ Neuer Kunde</button>
  </div>
  <div id="kundenliste">${kundenlisteHtml()}</div>`;
}

/* =========================================================
   Dialoge
   ========================================================= */
const dialog = document.getElementById("dialog");
const dialog2 = document.getElementById("dialog2");

function dialogOeffnen(html) {
  dialog.innerHTML = html;
  dialog.showModal();
}
function dialogSchliessen() {
  dialog.close();
  dialog.innerHTML = "";
}
dialog.addEventListener("click", (e) => { if (e.target === dialog) dialogSchliessen(); });

/* ---------- Kunde bearbeiten ---------- */
function kundeBearbeiten(id) {
  const k = id ? kunde(id) : { id: "", name: "", strasse: "", plzOrt: "", telefon: "", email: "", notizen: "" };
  if (!k) return;
  const auftraegeDesKunden = id ? daten.auftraege.filter((a) => a.kundeId === id) : [];

  dialogOeffnen(`
  <div class="dialog-kopf">
    <h2>${id ? "Kunde bearbeiten" : "Neuer Kunde"}</h2>
    <button class="schliessen" onclick="dialogSchliessen()" aria-label="Schließen">×</button>
  </div>
  <div class="dialog-inhalt">
    <label>Name *</label><input id="k-name" value="${esc(k.name)}">
    <div class="feldpaar">
      <div><label>Straße, Hausnummer</label><input id="k-strasse" value="${esc(k.strasse)}"></div>
      <div><label>PLZ, Ort</label><input id="k-plzort" value="${esc(k.plzOrt)}"></div>
      <div><label>Telefon</label><input id="k-telefon" value="${esc(k.telefon)}" type="tel"></div>
      <div><label>E-Mail</label><input id="k-email" value="${esc(k.email)}" type="email"></div>
    </div>
    <label>Notizen</label><textarea id="k-notizen">${esc(k.notizen)}</textarea>
    ${auftraegeDesKunden.length ? `<label>Aufträge dieses Kunden</label>` + auftraegeDesKunden.map((a) => auftragskarte(a)).join("") : ""}
  </div>
  <div class="dialog-fuss">
    ${id ? `<button class="gefahr klein" onclick="kundeLoeschen('${id}')">Löschen</button>` : "<span></span>"}
    <div class="rechtsgruppe">
      ${id ? `<button class="sekundaer" onclick="dialogSchliessen();auftragBearbeiten(null,'${id}')">+ Auftrag für diesen Kunden</button>` : ""}
      <button class="primaer" onclick="kundeSpeichern('${id || ""}')">Speichern</button>
    </div>
  </div>`);
  document.getElementById("k-name").focus();
}

function kundeSpeichern(id) {
  const name = document.getElementById("k-name").value.trim();
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const werte = {
    name,
    strasse: document.getElementById("k-strasse").value.trim(),
    plzOrt: document.getElementById("k-plzort").value.trim(),
    telefon: document.getElementById("k-telefon").value.trim(),
    email: document.getElementById("k-email").value.trim(),
    notizen: document.getElementById("k-notizen").value,
  };
  if (id) Object.assign(kunde(id), werte);
  else daten.kunden.push(Object.assign({ id: uid(), angelegtAm: heuteISO() }, werte));
  speichern();
  dialogSchliessen();
  render();
}

function kundeLoeschen(id) {
  const anzahl = daten.auftraege.filter((a) => a.kundeId === id).length;
  const frage = anzahl
    ? `Diesen Kunden und seine ${anzahl} Auftr${anzahl === 1 ? "ag" : "äge"} wirklich löschen?`
    : "Diesen Kunden wirklich löschen?";
  if (!confirm(frage)) return;
  daten.auftraege = daten.auftraege.filter((a) => a.kundeId !== id);
  daten.kunden = daten.kunden.filter((k) => k.id !== id);
  speichern();
  dialogSchliessen();
  render();
}

/* ---------- Auftrag bearbeiten ---------- */
let bearbeitungsPositionen = [];

function auftragBearbeiten(id, vorbelegterKundeId) {
  const a = id
    ? daten.auftraege.find((x) => x.id === id)
    : { id: "", kundeId: vorbelegterKundeId || "", titel: "", beschreibung: "", status: "anfrage",
        termin: "", einsatzOrt: "", zielOrt: "", positionen: [], material: "", notizen: "", angebotNr: "", rechnungNr: "" };
  if (!a) return;
  bearbeitungsPositionen = JSON.parse(JSON.stringify(a.positionen || []));
  if (bearbeitungsPositionen.length === 0) bearbeitungsPositionen.push({ bezeichnung: "", menge: 1, einheit: "Std.", preis: "" });

  dialogOeffnen(`
  <div class="dialog-kopf">
    <h2>${id ? "Auftrag bearbeiten" : "Neuer Auftrag"}</h2>
    <button class="schliessen" onclick="dialogSchliessen()" aria-label="Schließen">×</button>
  </div>
  <div class="dialog-inhalt">
    <div class="feldpaar">
      <div>
        <label>Kunde *</label>
        <select id="a-kunde">
          <option value="">– bitte wählen –</option>
          ${[...daten.kunden].sort((x, y) => x.name.localeCompare(y.name, "de"))
            .map((k) => `<option value="${k.id}" ${k.id === a.kundeId ? "selected" : ""}>${esc(k.name)}</option>`).join("")}
        </select>
        <div class="hinweis">Kunde fehlt? <a href="#" onclick="dialogSchliessen();kundeBearbeiten();return false">Neu anlegen</a>, dann Auftrag erstellen.</div>
      </div>
      <div>
        <label>Status</label>
        <select id="a-status">${STATUS.map((s) => `<option value="${s.id}" ${s.id === a.status ? "selected" : ""}>${s.name}</option>`).join("")}</select>
      </div>
    </div>
    <label>Titel * <span style="font-weight:400">(z. B. „Wohnung streichen“ oder „Umzug 3-Zimmer-Wohnung“)</span></label>
    <input id="a-titel" value="${esc(a.titel)}">
    <div class="feldpaar">
      <div><label>Termin / Beginn</label><input id="a-termin" type="date" value="${esc(a.termin)}"></div>
      <div><label>Beschreibung / Absprachen</label><textarea id="a-beschreibung" style="min-height:44px">${esc(a.beschreibung)}</textarea></div>
      <div><label>Einsatzort / Ladeadresse</label><input id="a-einsatzort" value="${esc(a.einsatzOrt)}" placeholder="Straße, PLZ Ort"></div>
      <div><label>Zieladresse <span style="font-weight:400">(bei Transport / Umzug)</span></label><input id="a-zielort" value="${esc(a.zielOrt)}" placeholder="leer lassen, wenn nicht nötig"></div>
    </div>

    <div class="zeile" style="justify-content:space-between;margin-top:12px">
      <label style="margin:0">Positionen (für Angebot / Rechnung)</label>
      <button class="sekundaer klein" onclick="assistentOeffnen()">🪄 Positionen aus Notizen</button>
    </div>
    <table class="positionen">
      <thead><tr><th>Leistung</th><th>Menge</th><th>Einheit</th><th>€/Einheit</th><th style="text-align:right">Summe</th><th></th></tr></thead>
      <tbody id="a-positionen"></tbody>
    </table>
    <button class="sekundaer klein" onclick="positionHinzufuegen()">+ Position</button>
    <div class="summenblock" id="a-summen"></div>

    <div class="feldpaar">
      <div><label>Material / Einkaufsliste</label><textarea id="a-material">${esc(a.material)}</textarea></div>
      <div><label>Interne Notizen</label><textarea id="a-notizen">${esc(a.notizen)}</textarea></div>
    </div>

    <label>📷 Fotos (Baustelle, Aufmaß, Ladung, Schäden)</label>
    ${id ? `
    <div class="fotogitter" id="a-fotos"></div>
    <button class="sekundaer klein" onclick="document.getElementById('a-fotoeingabe').click()">📷 Foto aufnehmen / hinzufügen</button>
    <input type="file" id="a-fotoeingabe" accept="image/*" capture="environment" multiple style="display:none" onchange="fotoHinzufuegen(this,'${id}')">
    ` : `<div class="hinweis">Auftrag zuerst speichern — danach können Fotos aufgenommen werden.</div>`}
    ${a.angebotNr || a.rechnungNr ? `<div class="hinweis">${a.angebotNr ? "Angebot Nr. " + esc(a.angebotNr) : ""}${a.angebotNr && a.rechnungNr ? " · " : ""}${a.rechnungNr ? "Rechnung Nr. " + esc(a.rechnungNr) : ""}</div>` : ""}
  </div>
  <div class="dialog-fuss">
    ${id ? `<button class="gefahr klein" onclick="auftragLoeschen('${id}')">Löschen</button>` : "<span></span>"}
    <div class="rechtsgruppe">
      ${id ? `<button class="sekundaer" onclick="dokumentDrucken('${id}','angebot')">Angebot drucken</button>
              <button class="sekundaer" onclick="dokumentDrucken('${id}','rechnung')">Rechnung drucken</button>` : ""}
      <button class="primaer" onclick="auftragSpeichern('${id || ""}')">Speichern</button>
    </div>
  </div>`);
  positionenRendern();
  if (id) fotosRendern(a);
  document.getElementById("a-titel").focus();
}

function positionenRendern() {
  const tbody = document.getElementById("a-positionen");
  tbody.innerHTML = bearbeitungsPositionen.map((p, i) => {
    const summe = (Number(p.menge) || 0) * (Number(p.preis) || 0);
    return `
    <tr>
      <td><input value="${esc(p.bezeichnung)}" placeholder="z. B. Wände streichen / Möbel tragen" oninput="positionAendern(${i},'bezeichnung',this.value)"></td>
      <td class="sp-menge"><input type="number" step="0.01" min="0" value="${esc(p.menge)}" oninput="positionAendern(${i},'menge',this.value)"></td>
      <td class="sp-einheit"><select onchange="positionAendern(${i},'einheit',this.value)">${EINHEITEN.map((e) => `<option ${e === p.einheit ? "selected" : ""}>${e}</option>`).join("")}</select></td>
      <td class="sp-preis"><input type="number" step="0.01" min="0" value="${esc(p.preis)}" oninput="positionAendern(${i},'preis',this.value)"></td>
      <td class="sp-summe">${summe ? euro(summe) : "–"}</td>
      <td class="sp-loeschen"><button class="pos-loeschen" title="Position entfernen" onclick="positionEntfernen(${i})">🗑</button></td>
    </tr>`;
  }).join("");

  const netto = bearbeitungsPositionen.reduce((s, p) => s + (Number(p.menge) || 0) * (Number(p.preis) || 0), 0);
  const e = daten.einstellungen;
  const mwstBetrag = e.kleinunternehmer ? 0 : netto * (Number(e.mwst) || 0) / 100;
  document.getElementById("a-summen").innerHTML = e.kleinunternehmer
    ? `<div class="brutto">Gesamt: ${euro(netto)}</div><div class="hinweis">Kein USt-Ausweis (Kleinunternehmer § 19 UStG)</div>`
    : `Netto: ${euro(netto)} · zzgl. ${e.mwst} % USt: ${euro(mwstBetrag)}<div class="brutto">Gesamt: ${euro(netto + mwstBetrag)}</div>`;
}

function positionAendern(i, feld, wert) {
  bearbeitungsPositionen[i][feld] = wert;
  // Nur Summen aktualisieren, ohne die Eingabefelder neu zu bauen (Fokus behalten)
  const zeile = document.querySelectorAll("#a-positionen tr")[i];
  const summe = (Number(bearbeitungsPositionen[i].menge) || 0) * (Number(bearbeitungsPositionen[i].preis) || 0);
  if (zeile) zeile.querySelector(".sp-summe").textContent = summe ? euro(summe) : "–";
  const netto = bearbeitungsPositionen.reduce((s, p) => s + (Number(p.menge) || 0) * (Number(p.preis) || 0), 0);
  const e = daten.einstellungen;
  const mwstBetrag = e.kleinunternehmer ? 0 : netto * (Number(e.mwst) || 0) / 100;
  document.getElementById("a-summen").innerHTML = e.kleinunternehmer
    ? `<div class="brutto">Gesamt: ${euro(netto)}</div><div class="hinweis">Kein USt-Ausweis (Kleinunternehmer § 19 UStG)</div>`
    : `Netto: ${euro(netto)} · zzgl. ${e.mwst} % USt: ${euro(mwstBetrag)}<div class="brutto">Gesamt: ${euro(netto + mwstBetrag)}</div>`;
}

function positionHinzufuegen() {
  bearbeitungsPositionen.push({ bezeichnung: "", menge: 1, einheit: "Std.", preis: "" });
  positionenRendern();
}

function positionEntfernen(i) {
  bearbeitungsPositionen.splice(i, 1);
  positionenRendern();
}

function auftragSpeichern(id) {
  const kundeId = document.getElementById("a-kunde").value;
  const titel = document.getElementById("a-titel").value.trim();
  if (!kundeId) { alert("Bitte einen Kunden wählen (oder zuerst anlegen)."); return; }
  if (!titel) { alert("Bitte einen Titel eingeben."); return; }

  const werte = {
    kundeId, titel,
    status: document.getElementById("a-status").value,
    termin: document.getElementById("a-termin").value,
    einsatzOrt: document.getElementById("a-einsatzort").value.trim(),
    zielOrt: document.getElementById("a-zielort").value.trim(),
    beschreibung: document.getElementById("a-beschreibung").value,
    material: document.getElementById("a-material").value,
    notizen: document.getElementById("a-notizen").value,
    positionen: bearbeitungsPositionen.filter((p) => p.bezeichnung.trim() !== ""),
    geaendertAm: new Date().toISOString(),
  };
  if (id) Object.assign(daten.auftraege.find((x) => x.id === id), werte);
  else daten.auftraege.push(Object.assign({ id: uid(), angelegtAm: heuteISO(), angebotNr: "", rechnungNr: "" }, werte));
  speichern();
  dialogSchliessen();
  render();
}

function auftragLoeschen(id) {
  if (!confirm("Diesen Auftrag wirklich löschen?")) return;
  const a = daten.auftraege.find((x) => x.id === id);
  for (const f of (a && a.fotos) || []) {
    fotoLokalLoeschen(f.id).catch(() => {});
    if (SERVER_MOEGLICH) fetch("api/fotos/" + f.id, { method: "DELETE" }).catch(() => {});
  }
  daten.auftraege = daten.auftraege.filter((x) => x.id !== id);
  speichern();
  dialogSchliessen();
  render();
}

/* =========================================================
   Angebot / Rechnung drucken
   ========================================================= */
function dokumentDrucken(id, art) {
  // Erst speichern, damit der Ausdruck den aktuellen Stand zeigt
  auftragSpeichernStill(id);
  const a = daten.auftraege.find((x) => x.id === id);
  if (!a) return;
  if (!a.positionen || a.positionen.length === 0) { alert("Bitte zuerst mindestens eine Position mit Leistung eintragen."); return; }

  const e = daten.einstellungen;
  const k = kunde(a.kundeId);

  // Dokumentnummer nur einmal vergeben, danach wiederverwenden
  const nummernFeld = art === "angebot" ? "angebotNr" : "rechnungNr";
  if (!a[nummernFeld]) { a[nummernFeld] = neueDokumentNummer(); speichern(); }
  const nummer = a[nummernFeld];

  const netto = auftragNetto(a);
  const mwstBetrag = e.kleinunternehmer ? 0 : netto * (Number(e.mwst) || 0) / 100;
  const brutto = netto + mwstBetrag;
  const heute = new Date().toLocaleDateString("de-DE");

  const titelzeile = art === "angebot" ? `Angebot Nr. ${esc(nummer)}` : `Rechnung Nr. ${esc(nummer)}`;
  const schluss = art === "angebot"
    ? `Dieses Angebot ist 30 Tage gültig. Ich freue mich auf Ihren Auftrag!`

/* =========================================================
   Fotos — lokal im Browser (IndexedDB), Abgleich mit dem PC
   ========================================================= */
let fotoDbVersprechen = null;
function fotoDb() {
  if (!fotoDbVersprechen) {
    fotoDbVersprechen = new Promise((aufloesen, ablehnen) => {
      const anfrage = indexedDB.open("maler-fotos", 1);
      anfrage.onupgradeneeded = () => anfrage.result.createObjectStore("fotos", { keyPath: "id" });
      anfrage.onsuccess = () => aufloesen(anfrage.result);
      anfrage.onerror = () => ablehnen(anfrage.error);
    });
  }
  return fotoDbVersprechen;
}

function fotoDbAktion(modus, arbeit) {
  return fotoDb().then((db) => new Promise((aufloesen, ablehnen) => {
    const tx = db.transaction("fotos", modus);
    const anfrage = arbeit(tx.objectStore("fotos"));
    anfrage.onsuccess = () => aufloesen(anfrage.result);
    anfrage.onerror = () => ablehnen(anfrage.error);
  }));
}

const fotoLokalSpeichern = (eintrag) => fotoDbAktion("readwrite", (s) => s.put(eintrag));
const fotoLokalHolen = (id) => fotoDbAktion("readonly", (s) => s.get(id));
const fotoLokalLoeschen = (id) => fotoDbAktion("readwrite", (s) => s.delete(id));
const fotoAlleLokal = () => fotoDbAktion("readonly", (s) => s.getAll());

// Foto verkleinern (max. 1600 px, JPEG) — spart Speicher und Übertragungszeit
function fotoVerkleinern(datei) {
  return new Promise((aufloesen, ablehnen) => {
    const bild = new Image();
    bild.onload = () => {
      const faktor = Math.min(1, 1600 / Math.max(bild.width, bild.height));
      const leinwand = document.createElement("canvas");
      leinwand.width = Math.round(bild.width * faktor);
      leinwand.height = Math.round(bild.height * faktor);
      leinwand.getContext("2d").drawImage(bild, 0, 0, leinwand.width, leinwand.height);
      URL.revokeObjectURL(bild.src);
      leinwand.toBlob((blob) => blob ? aufloesen(blob) : ablehnen(new Error("Bild konnte nicht verarbeitet werden")), "image/jpeg", 0.82);
    };
    bild.onerror = () => ablehnen(new Error("Datei ist kein lesbares Bild"));
    bild.src = URL.createObjectURL(datei);
  });
}

async function fotoHinzufuegen(eingabe, auftragId) {
  const a = daten.auftraege.find((x) => x.id === auftragId);
  if (!a) return;
  a.fotos = a.fotos || [];
  for (const datei of eingabe.files) {
    try {
      const blob = await fotoVerkleinern(datei);
      const id = uid();
      await fotoLokalSpeichern({ id, blob, hochgeladen: false });
      a.fotos.push({ id, am: heuteISO() });
    } catch (fehler) {
      alert("Foto konnte nicht übernommen werden: " + fehler.message);
    }
  }
  eingabe.value = "";
  a.geaendertAm = new Date().toISOString();
  speichern();
  fotosRendern(a);
}

async function fotoEntfernen(auftragId, fotoId) {
  if (!confirm("Dieses Foto löschen?")) return;
  const a = daten.auftraege.find((x) => x.id === auftragId);
  if (!a) return;
  a.fotos = (a.fotos || []).filter((f) => f.id !== fotoId);
  speichern();
  fotoLokalLoeschen(fotoId).catch(() => {});
  if (SERVER_MOEGLICH) fetch("api/fotos/" + fotoId, { method: "DELETE" }).catch(() => {});
  fotosRendern(a);
}

async function fotosRendern(a) {
  const behaelter = document.getElementById("a-fotos");
  if (!behaelter) return;
  const fotos = a.fotos || [];
  behaelter.innerHTML = fotos.map((f) => `
    <div class="fotokachel">
      <img id="foto-${f.id}" alt="Baustellenfoto vom ${datumFormat(f.am)}" title="Aufgenommen am ${datumFormat(f.am)}">
      <button class="foto-loeschen" title="Foto löschen" onclick="fotoEntfernen('${a.id}','${f.id}')">×</button>
    </div>`).join("");
  for (const f of fotos) {
    const bild = document.getElementById("foto-" + f.id);
    if (!bild) continue;
    try {
      const lokal = await fotoLokalHolen(f.id);
      bild.src = lokal ? URL.createObjectURL(lokal.blob) : (SERVER_MOEGLICH ? "api/fotos/" + f.id : "");
    } catch {
      if (SERVER_MOEGLICH) bild.src = "api/fotos/" + f.id;
    }
    bild.onclick = () => {
      document.getElementById("lightbox-bild").src = bild.src;
      document.getElementById("lightbox").classList.add("offen");
    };
  }
}

// Noch nicht übertragene Fotos zum PC hochladen (läuft im Hintergrund)
let fotoSyncLaeuft = false;
async function fotoSync() {
  if (!SERVER_MOEGLICH || !serverAktiv || fotoSyncLaeuft) return;
  fotoSyncLaeuft = true;
  try {
    const alle = await fotoAlleLokal();
    for (const eintrag of alle.filter((x) => !x.hochgeladen)) {
      const datenUrl = await new Promise((aufloesen, ablehnen) => {
        const leser = new FileReader();
        leser.onload = () => aufloesen(leser.result);
        leser.onerror = () => ablehnen(leser.error);
        leser.readAsDataURL(eintrag.blob);
      });
      const antwort = await fetch("api/fotos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: eintrag.id, datenUrl }),
      });
      if (!antwort.ok) break;
      eintrag.hochgeladen = true;
      await fotoLokalSpeichern(eintrag);
    }
  } catch { /* nächster Abgleich versucht es erneut */ }
  fotoSyncLaeuft = false;
}

/* =========================================================
   Notiz-Assistent — Notizen in Angebots-Positionen verwandeln
   ========================================================= */
const EINHEIT_ERKENNUNG = [
  [/^(m²|m2|qm)$/i, "m²"],
  [/^(m³|m3|cbm|kubikmeter)$/i, "m³"],
  [/^(std\.?|stunden?|h)$/i, "Std."],
  [/^(stk\.?|stück)$/i, "Stk."],
  [/^lfm$/i, "lfm"],
  [/^km$/i, "km"],
  [/^kg$/i, "kg"],
  [/^kartons?$/i, "Karton"],
  [/^fahrt(en)?$/i, "Fahrt"],
  [/^tage?$/i, "Tag"],
  [/^(liter|l)$/i, "Liter"],
  [/^pausch(al|\.)?$/i, "pausch."],
];

function zahlDe(text) { return Number(String(text).replace(",", ".")); }

// Eine Notizzeile wie „Wohnzimmer Wände 62 m² streichen à 12,50“ zerlegen.
// Zeilen ohne Mengen- oder Preisangabe gelten als Beschreibung und werden übersprungen.
function zeileZuPosition(zeile) {
  const mengeTreffer = zeile.match(/(\d+(?:[.,]\d+)?)\s*(m²|m2|qm|m³|m3|cbm|kubikmeter|std\.?|stunden?|stk\.?|stück|lfm|liter|kartons?|fahrten?|tage?|km|kg|pausch(?:al|\.)?|h|l)(?![a-zäöü])/i);
  // Preis nur bei eindeutigem Signal: „à 12,50“ oder Betrag mit €/EUR („45 €“).
  // „je 8 Std“ ist eine Menge, kein Preis.
  const preisTreffer = zeile.match(/à\s*(\d+(?:[.,]\d+)?)|(\d+(?:[.,]\d+)?)\s*(?:€|eur(?![a-zäöü]))/i);
  if (!mengeTreffer && !preisTreffer) return null;

  let einheit = "pausch.";
  if (mengeTreffer) {
    for (const [muster, name] of EINHEIT_ERKENNUNG) {
      if (muster.test(mengeTreffer[2])) { einheit = name; break; }
    }
  }
  const menge = mengeTreffer ? zahlDe(mengeTreffer[1]) : 1;

  let preis = preisTreffer ? zahlDe(preisTreffer[1] ?? preisTreffer[2]) : "";
  let quelle = preisTreffer ? "aus Notiz" : "";
  if (preis === "" || isNaN(preis)) {
    const klein = zeile.toLowerCase();
    const eintrag = (daten.einstellungen.preisliste || []).find((p) => p.begriff && klein.includes(p.begriff.toLowerCase()));
    if (eintrag) { preis = Number(eintrag.preis) || ""; quelle = "Preisliste „" + eintrag.begriff + "“"; }
    else if (einheit === "Std.") { preis = Number(daten.einstellungen.stundensatz) || ""; quelle = "Stundensatz"; }
    else { preis = ""; quelle = "bitte ergänzen"; }
  }

  let bezeichnung = zeile;
  if (mengeTreffer) bezeichnung = bezeichnung.replace(mengeTreffer[0], " ");
  if (preisTreffer) bezeichnung = bezeichnung.replace(preisTreffer[0], " ");
  bezeichnung = bezeichnung.replace(/[,;:–-]\s*$/g, "").replace(/\s{2,}/g, " ").trim();
  if (!bezeichnung) bezeichnung = zeile.trim();

  return { bezeichnung, menge, einheit, preis, quelle };
}

function notizenZuPositionen(text) {
  return String(text || "").split(/\n/).map((z) => zeileZuPosition(z.trim())).filter(Boolean);
}

  const summe = gefunden.reduce((s, p) => s + p.menge * (Number(p.preis) || 0), 0);
  ziel.innerHTML = `

function assistentUebernehmen() {
  const gefunden = notizenZuPositionen(document.getElementById("as-text").value);
  if (gefunden.length === 0) { alert("Keine verwertbare Zeile gefunden — bitte Menge oder Preis ergänzen (z. B. „62 m²“)."); return; }
  if (bearbeitungsPositionen.length === 1 && !bearbeitungsPositionen[0].bezeichnung.trim()) bearbeitungsPositionen = [];
  for (const p of gefunden) bearbeitungsPositionen.push({ bezeichnung: p.bezeichnung, menge: p.menge, einheit: p.einheit, preis: p.preis });

  e.preisliste = document.getElementById("e-preisliste").value.split(/\n/)
    .map((zeile) => {
      const teile = zeile.split(";").map((t) => t.trim());
      if (teile.length < 2 || !teile[0]) return null;
      return { begriff: teile[0], preis: zahlDe(teile[1]) || 0, einheit: teile[2] || "m²" };
    })
    .filter(Boolean);
  speichern();
  render();
  alert("Einstellungen gespeichert.");
}

function sicherungExportieren() {
  const blob = new Blob([JSON.stringify(daten, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "auftraege-sicherung-" + heuteISO() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function sicherungImportieren(eingabe) {
  const datei = eingabe.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    try {
      const geparst = JSON.parse(leser.result);
      if (!geparst || !Array.isArray(geparst.kunden) || !Array.isArray(geparst.auftraege)) {
        throw new Error("Unerwartetes Format");
      }
      if (!confirm("Achtung: Die aktuelle Datenbank wird durch die Sicherung ersetzt. Fortfahren?")) return;
      daten = Object.assign(leererZustand(), geparst, {
        einstellungen: Object.assign(leererZustand().einstellungen, geparst.einstellungen || {}),
      });
      speichern();
      render();
      alert("Sicherung erfolgreich eingespielt.");
    } catch (err) {
      alert("Diese Datei ist keine gültige Sicherung: " + err.message);
    } finally {
      eingabe.value = "";
    }
  };
  leser.readAsText(datei);
}

function allesLoeschen() {
  if (!confirm("Wirklich ALLE Kunden, Aufträge und Einstellungen löschen?")) return;
  if (!confirm("Letzte Warnung: Ohne Sicherung sind die Daten unwiederbringlich weg. Trotzdem löschen?")) return;
  daten = leererZustand();
  speichern();
  render();
}
