<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d5c8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aufträge">
<title>Auftragsverwaltung – Handwerk, Transport &amp; Umzug</title>
<style>
  :root {
    --blau: #1d5c8f;
    --blau-dunkel: #14415f;
    --grau-hell: #f4f6f8;
    --grau: #e2e7ec;
    --text: #22303c;
    --text-leise: #64748b;
    --gruen: #1e7d46;
    --gelb: #b45309;
    --rot: #b91c1c;
    --radius: 10px;
    --schatten: 0 1px 3px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--grau-hell);
    color: var(--text);
    font-size: 16px;
    line-height: 1.45;
  }

  /* ---------- Kopf & Navigation ---------- */
  header {
    background: var(--blau);
    color: #fff;
    padding: 14px 16px 0;
  }
  header h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
  header h1 small { font-weight: 400; opacity: .8; font-size: .85rem; margin-left: 8px; }
  /* Reiter brechen bei schmalen Displays um, damit alle (auch „Einstellungen“)
     immer sichtbar und antippbar sind */
  nav { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 12px; }
  nav button {
    background: rgba(255,255,255,.14); border: none; color: #fff;
    padding: 8px 14px; font-size: .95rem; cursor: pointer;
    border-radius: 8px; white-space: nowrap;
  }
  nav button.aktiv { background: var(--grau-hell); color: var(--text); font-weight: 600; }

  main { max-width: 960px; margin: 0 auto; padding: 16px; }

  /* ---------- Bausteine ---------- */
  .karte {
    background: #fff; border-radius: var(--radius); box-shadow: var(--schatten);
    padding: 16px; margin-bottom: 12px;
  }
  .karte h2 { margin: 0 0 12px; font-size: 1.05rem; }
  .zeile { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .waechst { flex: 1; min-width: 160px; }

  .kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kachel {
    background: #fff; border-radius: var(--radius); box-shadow: var(--schatten);
    padding: 14px; cursor: pointer; border: none; text-align: left; font: inherit;
  }
  .kachel .zahl { font-size: 1.7rem; font-weight: 700; color: var(--blau); }
  .kachel .beschriftung { color: var(--text-leise); font-size: .85rem; }
  .kachel.warn .zahl { color: var(--gelb); }

  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: .78rem; font-weight: 600; white-space: nowrap;
  }
  .badge.anfrage   { background: #e0e7ff; color: #3730a3; }
  .badge.angebot   { background: #fef3c7; color: #92400e; }
  .badge.beauftragt{ background: #cffafe; color: #155e75; }
  .badge.in_arbeit { background: #dbeafe; color: #1e40af; }
  .badge.fertig    { background: #fee2e2; color: #991b1b; }
  .badge.bezahlt   { background: #dcfce7; color: #166534; }

  button.primaer, button.sekundaer, button.gefahr {
    border: none; border-radius: 8px; padding: 10px 16px;
    font-size: .95rem; cursor: pointer; font-weight: 600;
  }
  button.primaer { background: var(--blau); color: #fff; }
  button.primaer:hover { background: var(--blau-dunkel); }
  button.sekundaer { background: var(--grau); color: var(--text); }
  button.gefahr { background: #fff; color: var(--rot); border: 1px solid var(--rot); }
  button.klein { padding: 6px 10px; font-size: .82rem; }

  input, select, textarea {
    font: inherit; padding: 9px 10px; border: 1px solid #cbd5e1;
    border-radius: 8px; width: 100%; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 70px; }
  label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-leise); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }

  .filterleiste { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .filterleiste button {
    border: 1px solid var(--grau); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: .82rem; cursor: pointer; color: var(--text-leise);
  }
  .filterleiste button.aktiv { background: var(--blau); border-color: var(--blau); color: #fff; }

  .listenkarte {
    background: #fff; border-radius: var(--radius); box-shadow: var(--schatten);
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    border: none; width: 100%; text-align: left; font: inherit;
  }
  .listenkarte:hover { outline: 2px solid var(--blau); outline-offset: -2px; }
  .listenkarte .titel { font-weight: 600; }
  .listenkarte .unterzeile { color: var(--text-leise); font-size: .85rem; margin-top: 2px; }
  .listenkarte .rechts { text-align: right; flex-shrink: 0; }
  .listenkarte .summe { font-weight: 700; margin-top: 4px; }

  .leer { text-align: center; color: var(--text-leise); padding: 32px 16px; }

  /* ---------- Positions-Tabelle ---------- */
  table.positionen { width: 100%; border-collapse: collapse; }
  table.positionen th { text-align: left; font-size: .78rem; color: var(--text-leise); padding: 4px 6px 4px 0; }
  table.positionen td { padding: 3px 6px 3px 0; vertical-align: middle; }
  table.positionen input { padding: 7px 8px; }
  table.positionen .sp-menge  { width: 70px; }
  table.positionen .sp-einheit{ width: 78px; }
  table.positionen .sp-preis  { width: 100px; }
  table.positionen .sp-summe  { width: 90px; text-align: right; font-size: .9rem; white-space: nowrap; }
  table.positionen .sp-loeschen { width: 34px; }
  .pos-loeschen {
    border: none; background: transparent; color: var(--rot);
    font-size: 1.1rem; cursor: pointer; padding: 4px;
  }
  .summenblock { text-align: right; margin-top: 10px; font-size: .95rem; }
  .summenblock .brutto { font-size: 1.15rem; font-weight: 700; }

  /* ---------- Dialog ---------- */
  dialog {
    border: none; border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,.25);
    padding: 0; width: min(680px, calc(100vw - 24px));
    max-height: calc(100vh - 40px);
  }
  dialog::backdrop { background: rgba(15,23,42,.45); }
  .dialog-kopf {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--grau);
    position: sticky; top: 0; background: #fff; z-index: 2;
  }
  .dialog-kopf h2 { margin: 0; font-size: 1.05rem; }
  .dialog-kopf .schliessen { border: none; background: transparent; font-size: 1.4rem; cursor: pointer; color: var(--text-leise); }
  .dialog-inhalt { padding: 16px 18px; }
  .dialog-fuss {
    display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap;
    padding: 12px 18px; border-top: 1px solid var(--grau);
    position: sticky; bottom: 0; background: #fff;
  }
  .dialog-fuss .rechtsgruppe { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  .feldpaar { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .feldpaar { grid-template-columns: 1fr; } }

  .hinweis { font-size: .82rem; color: var(--text-leise); margin-top: 6px; }

  /* ---------- Synchronisierung ---------- */
  .sync-badge {
    display: inline-block; font-size: .72rem; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; background: rgba(255,255,255,.15); color: #fff;
    margin: 0 0 10px;
  }
  .sync-badge:empty { display: none; }
  .sync-badge.gruen { background: #14532d; }
  .sync-badge.gelb { background: #92400e; }

  /* ---------- Fotos ---------- */
  .fotogitter { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .fotokachel { position: relative; }
  .fotokachel img {
    width: 92px; height: 92px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--grau); cursor: pointer; background: var(--grau-hell);
  }
  .fotokachel .foto-loeschen {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
    border-radius: 50%; border: none; background: var(--rot); color: #fff;
    font-size: .8rem; cursor: pointer; line-height: 1;
  }
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.88); align-items: center; justify-content: center; cursor: zoom-out;
  }
  #lightbox.offen { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 96vh; border-radius: 6px; }

  /* ---------- Notiz-Assistent ---------- */
  .vorschau-tabelle { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .vorschau-tabelle th { text-align: left; color: var(--text-leise); font-size: .78rem; padding: 4px 6px 4px 0; }
  .vorschau-tabelle td { padding: 4px 6px 4px 0; border-top: 1px solid var(--grau); }

  /* ---------- Stundenzettel ---------- */
  .zeitzeile { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .zeitzeile input { padding: 7px 8px; }
  .zeitzeile .z-datum { width: 150px; }
  .zeitzeile .z-zeit { width: 78px; }
  .zeitzeile .z-dauer { flex: 1; color: var(--text-leise); font-size: .85rem; white-space: nowrap; }
  .stoppuhr-laeuft { background: var(--rot) !important; color: #fff !important; }
  .zeit-summe { text-align: right; font-size: .9rem; color: var(--text-leise); margin-top: 4px; }

  /* ---------- Unterschrift ---------- */
  .unterschrift-flaeche {
    border: 1px dashed #94a3b8; border-radius: 8px; background: #fff;
    width: 100%; height: 150px; touch-action: none; display: block;
  }
  .unterschrift-vorschau { max-width: 220px; border: 1px solid var(--grau); border-radius: 8px; background: #fff; }

  /* ---------- Material-Auswahl ---------- */
  .material-zeile { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .material-zeile .m-name { flex: 1; }
  .material-zeile .m-preis { color: var(--text-leise); font-size: .85rem; width: 90px; text-align: right; }
  .material-zeile input[type=number] { width: 72px; }

  /* ---------- Terminkalender ---------- */
  .kal-kopf { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .kal-kopf h2 { margin: 0; font-size: 1.1rem; }
  .kal-gitter { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .kal-wtag { text-align: center; font-size: .72rem; font-weight: 600; color: var(--text-leise); padding: 4px 0; }
  .kal-tag {
    min-height: 62px; border: 1px solid var(--grau); border-radius: 8px; padding: 4px;
    font-size: .8rem; background: #fff; display: flex; flex-direction: column; gap: 2px;
  }
  .kal-tag.leer { background: transparent; border: none; }
  .kal-tag.heute { border-color: var(--blau); border-width: 2px; }
  .kal-tag .tagzahl { font-size: .72rem; color: var(--text-leise); font-weight: 600; }
  .kal-punkt {
    font-size: .68rem; background: var(--blau); color: #fff; border-radius: 4px;
    padding: 1px 4px; cursor: pointer; border: none; text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
  }
  @media (max-width: 560px) {
    .kal-tag { min-height: 44px; }
    .kal-punkt { font-size: 0; padding: 3px; }
    .kal-punkt::before { content: "●"; font-size: .7rem; }
  }

  /* ---------- Umsatz ---------- */
  .umsatz-tabelle { width: 100%; border-collapse: collapse; }
  .umsatz-tabelle th, .umsatz-tabelle td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--grau); font-variant-numeric: tabular-nums; }
  .umsatz-tabelle th:first-child, .umsatz-tabelle td:first-child { text-align: left; }
  .umsatz-tabelle tr.gesamt td { font-weight: 700; border-top: 2px solid var(--text-leise); }
  .umsatz-balken { height: 10px; background: var(--blau); border-radius: 5px; }

  /* ---------- Druck (Angebot / Rechnung) ---------- */
  #druckbereich { display: none; }
  @media print {
    body > *:not(#druckbereich) { display: none !important; }
    #druckbereich { display: block; }
    body { background: #fff; }
  }
  #druckbereich { font-size: 13px; color: #000; padding: 10mm; }
  #druckbereich .d-kopf { display: flex; justify-content: space-between; margin-bottom: 28px; }
  #druckbereich .d-firma { text-align: right; font-size: 12px; line-height: 1.5; }
  #druckbereich .d-firma strong { font-size: 15px; }
  #druckbereich .d-absenderzeile { font-size: 9px; text-decoration: underline; margin-bottom: 6px; }
  #druckbereich h1 { font-size: 19px; margin: 24px 0 4px; }
  #druckbereich .d-meta { font-size: 12px; color: #333; margin-bottom: 18px; }
  #druckbereich table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  #druckbereich th { text-align: left; border-bottom: 1.5px solid #000; padding: 6px 4px; font-size: 12px; }
  #druckbereich td { padding: 6px 4px; border-bottom: 1px solid #ddd; vertical-align: top; }
  #druckbereich .d-rechts { text-align: right; white-space: nowrap; }
  #druckbereich .d-summen { margin-left: auto; width: 260px; }
  #druckbereich .d-summen td { border: none; padding: 3px 4px; }
  #druckbereich .d-summen .d-brutto td { border-top: 1.5px solid #000; font-weight: 700; font-size: 14px; }
  #druckbereich .d-fuss { margin-top: 32px; font-size: 11px; color: #333; line-height: 1.6; border-top: 1px solid #999; padding-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>🛠️ Auftragsverwaltung <small id="kopf-firma"></small></h1>
  <div class="sync-badge" id="sync-badge"></div>
  <nav id="hauptnav"></nav>
</header>

<main id="inhalt"></main>

<dialog id="dialog"></dialog>
<dialog id="dialog2"></dialog>
<div id="lightbox" onclick="this.classList.remove('offen')"><img id="lightbox-bild" alt="Foto in Großansicht"></div>
<div id="druckbereich"></div>

<script>
"use strict";

/* =========================================================
   Datenhaltung – alles liegt lokal im Browser (localStorage)
   ========================================================= */
const SPEICHER_SCHLUESSEL = "maler-auftragsverwaltung-v1";

const STATUS = [
  { id: "anfrage",    name: "Anfrage" },
  { id: "angebot",    name: "Angebot erstellt" },
  { id: "beauftragt", name: "Beauftragt" },
  { id: "in_arbeit",  name: "In Arbeit" },
  { id: "fertig",     name: "Fertig – Rechnung offen" },
  { id: "bezahlt",    name: "Bezahlt" },
];
const EINHEITEN = ["m²", "m³", "lfm", "Std.", "Stk.", "km", "kg", "Karton", "Fahrt", "Tag", "Liter", "pausch."];

// Branchen-Vorlagen: füllen auf Wunsch die Preisliste in den Einstellungen
const BRANCHEN = {
  maler: { name: "Maler / Lackierer", preisliste: [
    { begriff: "streichen", einheit: "m²", preis: 12.5 },
    { begriff: "spachteln", einheit: "m²", preis: 8 },
    { begriff: "grundieren", einheit: "m²", preis: 4.5 },
    { begriff: "tapezieren", einheit: "m²", preis: 14 },
    { begriff: "lackieren", einheit: "lfm", preis: 18 },
    { begriff: "abkleben", einheit: "pausch.", preis: 90 },
  ]},
  elektro: { name: "Elektro", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 65 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 45 },
    { begriff: "steckdose", einheit: "Stk.", preis: 35 },
    { begriff: "schalter", einheit: "Stk.", preis: 35 },
    { begriff: "leuchte", einheit: "Stk.", preis: 45 },
    { begriff: "leitung", einheit: "lfm", preis: 12 },
  ]},
  sanitaer: { name: "Sanitär / Heizung", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 75 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 49 },
    { begriff: "wc", einheit: "Stk.", preis: 180 },
    { begriff: "waschbecken", einheit: "Stk.", preis: 150 },
    { begriff: "armatur", einheit: "Stk.", preis: 95 },
    { begriff: "rohr", einheit: "lfm", preis: 28 },
  ]},
  garten: { name: "Garten / Landschaft", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 55 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 35 },
    { begriff: "hecke", einheit: "lfm", preis: 8 },
    { begriff: "rasen", einheit: "m²", preis: 0.5 },
    { begriff: "entsorgung", einheit: "m³", preis: 45 },
  ]},
  transport: { name: "Transport & Umzug", preisliste: [
    { begriff: "helfer", einheit: "Std.", preis: 38 },
    { begriff: "träger", einheit: "Std.", preis: 38 },
    { begriff: "fahrer", einheit: "Std.", preis: 45 },
    { begriff: "lkw", einheit: "Tag", preis: 280 },
    { begriff: "transporter", einheit: "Tag", preis: 120 },
    { begriff: "km", einheit: "km", preis: 1.2 },
    { begriff: "karton", einheit: "Karton", preis: 2.5 },
    { begriff: "halteverbot", einheit: "pausch.", preis: 120 },
    { begriff: "klavier", einheit: "pausch.", preis: 250 },
    { begriff: "möbel", einheit: "Std.", preis: 40 },
  ]},
  allgemein: { name: "Allgemein / Sonstiges", preisliste: [
    { begriff: "arbeitsstunde", einheit: "Std.", preis: 60 },
    { begriff: "anfahrt", einheit: "pausch.", preis: 40 },
    { begriff: "entsorgung", einheit: "m³", preis: 45 },
  ]},
};

let daten = ladeDaten();

function leererZustand() {
  return {
    einstellungen: {
      firma: "", inhaber: "", strasse: "", plzOrt: "", telefon: "", email: "",
      iban: "", steuernummer: "", mwst: 19, kleinunternehmer: false,
      stundensatz: 55, zahlungsziel: 14, naechsteNummer: 1,
      branche: "allgemein",
      preisliste: [
        { begriff: "arbeitsstunde", einheit: "Std.", preis: 60 },
        { begriff: "anfahrt", einheit: "pausch.", preis: 40 },
        { begriff: "entsorgung", einheit: "m³", preis: 45 },
      ],
      materialliste: [],
    },
    stand: "",
    kunden: [],
    auftraege: [],
  };
}

function ladeDaten() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (!roh) return leererZustand();
    const geparst = JSON.parse(roh);
    // fehlende Felder aus Vorversionen auffüllen
    return Object.assign(leererZustand(), geparst, {
      einstellungen: Object.assign(leererZustand().einstellungen, geparst.einstellungen || {}),
    });
  } catch (e) {
    console.error("Daten konnten nicht geladen werden:", e);
    return leererZustand();
  }
}

function speichern() {
  daten.stand = new Date().toISOString();
  localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
  planeSync();
}

/* ---------- Synchronisierung mit dem PC-Programm (server.js) ----------
   Wird die App über http://<PC>:8722 geöffnet, ist der PC die führende
   Ablage: Änderungen werden dorthin geschrieben; ist er gerade nicht
   erreichbar (unterwegs beim Kunden), bleibt alles lokal gespeichert
   und wird nachgereicht, sobald das Heimnetz wieder da ist.          */
// Drei Betriebsarten:
//  - SERVER_SELBST: Seite kommt direkt vom PC-Programm → API relativ ansprechen
//  - IN_APP: Seite läuft in der Android-App (eingebaute Oberfläche) → API über
//    die in den Einstellungen hinterlegte PC-Adresse (serverBasis)
//  - sonst Einzeldatei (file://) → Sync optional über serverBasis
const IN_APP = navigator.userAgent.includes("AuftragsApp") || location.hostname === "app.local";
const SERVER_SELBST = !IN_APP && (location.protocol === "http:" || location.protocol === "https:");
const SERVER_BASIS_SCHLUESSEL = SPEICHER_SCHLUESSEL + ":server";
let serverBasis = (localStorage.getItem(SERVER_BASIS_SCHLUESSEL) || "").replace(/\/+$/, "");

function serverMoeglich() { return SERVER_SELBST || !!serverBasis; }
function apiUrl(pfad) { return SERVER_SELBST ? pfad : serverBasis + "/" + pfad; }

// fetch mit Zeitlimit: eine hängende Verbindung darf den Abgleich nie
// dauerhaft blockieren (z. B. Firewall verschluckt Pakete kommentarlos)
function fetchMitLimit(url, optionen = {}, ms = 10000) {
  return fetch(url, Object.assign({ signal: AbortSignal.timeout(ms) }, optionen));
}

const SYNC_FLAG = SPEICHER_SCHLUESSEL + ":ausstehend";
let serverAktiv = false;
let syncAusstehend = localStorage.getItem(SYNC_FLAG) === "1";
let syncTimer = null;
let syncLaeuft = false;

function syncAnzeige() {
  const el = document.getElementById("sync-badge");
  if (!el) return;
  if (IN_APP && !serverBasis) { el.style.display = ""; el.textContent = "PC-Adresse in den Einstellungen eintragen"; el.className = "sync-badge gelb"; return; }
  if (!serverMoeglich()) { el.textContent = ""; el.className = "sync-badge"; el.style.display = "none"; return; }
  el.style.display = "";
  if (serverAktiv && !syncAusstehend) { el.textContent = "✓ Mit PC synchron"; el.className = "sync-badge gruen"; }
  else if (syncAusstehend) { el.textContent = "⏳ Wird übertragen, sobald der PC erreichbar ist"; el.className = "sync-badge gelb"; }
  else { el.textContent = "PC nicht erreichbar – Daten bleiben lokal"; el.className = "sync-badge gelb"; }
}

function planeSync() {
  if (!serverMoeglich()) return;
  syncAusstehend = true;
  localStorage.setItem(SYNC_FLAG, "1");
  syncAnzeige();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncJetzt, 400);
}

async function syncJetzt() {
  if (!serverMoeglich() || syncLaeuft) return;
  syncLaeuft = true;
  try {
    const antwort = await fetchMitLimit(apiUrl("api/daten"), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(daten),
    });
    if (!antwort.ok) throw new Error("Serverantwort " + antwort.status);
    serverAktiv = true;
    syncAusstehend = false;
    localStorage.removeItem(SYNC_FLAG);
    fotoSync();
  } catch {
    serverAktiv = false;
  } finally {
    syncLaeuft = false;
    syncAnzeige();
  }
}

// Regelmäßiger Abgleich: eigene Änderungen nachschieben bzw. neuere
// Stände vom PC übernehmen (z. B. wenn dort weitergearbeitet wurde).
async function syncAbgleich() {
  if (!serverMoeglich() || syncLaeuft) return;
  if (syncAusstehend) { syncJetzt(); return; }
  try {
    const antwort = await fetchMitLimit(apiUrl("api/daten"), { cache: "no-store" });
    if (!antwort.ok) throw new Error("Serverantwort " + antwort.status);
    serverAktiv = true;
    const serverDaten = await antwort.json();
    if (serverDaten && serverDaten.stand && serverDaten.stand > (daten.stand || "")) {
      daten = Object.assign(leererZustand(), serverDaten, {
        einstellungen: Object.assign(leererZustand().einstellungen, serverDaten.einstellungen || {}),
      });
      localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
      if (!dialog.open && !dialog2.open) render();
    }
    fotoSync();
  } catch {
    serverAktiv = false;
  }
  syncAnzeige();
}

async function syncStart() {
  // Abgleich-Takt immer einrichten — die PC-Adresse kann auch erst
  // später in den Einstellungen eingetragen werden
  setInterval(syncAbgleich, 20000);
  if (!serverMoeglich()) { syncAnzeige(); return; }
  await syncAbgleich();
  // Erststart am Server: lokale Daten hochladen, falls dort noch nichts liegt
  if (serverAktiv && (daten.kunden.length || daten.auftraege.length) && !syncAusstehend) {
    try {
      const antwort = await fetchMitLimit(apiUrl("api/daten"), { cache: "no-store" });
      if (antwort.ok && (await antwort.json()) === null) planeSync();
    } catch { /* nächster Abgleich versucht es erneut */ }
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Hilfsfunktionen ---------- */
const euro = (n) => (isFinite(n) ? n : 0).toLocaleString("de-DE", { style: "currency", currency: "EUR" });

function datumFormat(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
}

function heuteISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function statusName(id) {
  const s = STATUS.find((x) => x.id === id);
  return s ? s.name : id;
}

function kunde(id) {
  return daten.kunden.find((k) => k.id === id) || null;
}

const aufCent = (n) => Math.round((Number(n) || 0) * 100) / 100;

// Zentrale Summenberechnung inkl. Rabatt — von Dialog, Druck, PDF und
// Umsatz gemeinsam genutzt, damit überall dieselben Zahlen stehen.
// Alle Werte auf Cent gerundet, damit die angezeigten Zeilen exakt zum
// Gesamtbetrag summieren (Rechnungspflicht: keine Cent-Differenzen).
function summenBerechnen(positionen, rabatt) {
  const e = daten.einstellungen;
  // Jede Position auf Cent runden (so wie sie auch angezeigt wird) und summieren
  const nettoRoh = aufCent((positionen || []).reduce((s, p) => s + aufCent((Number(p.menge) || 0) * (Number(p.preis) || 0)), 0));
  let rabattBetrag = 0;
  if (rabatt && Number(rabatt.wert)) {
    rabattBetrag = rabatt.art === "betrag"
      ? Math.min(Number(rabatt.wert), nettoRoh)
      : nettoRoh * (Number(rabatt.wert) || 0) / 100;
  }
  rabattBetrag = aufCent(rabattBetrag);
  const netto = aufCent(nettoRoh - rabattBetrag);
  const ust = e.kleinunternehmer ? 0 : aufCent(netto * (Number(e.mwst) || 0) / 100);
  return { nettoRoh, rabattBetrag, netto, ust, brutto: aufCent(netto + ust) };
}

function auftragNetto(a) {
  return summenBerechnen(a.positionen, a.rabatt).netto;
}

function auftragBrutto(a) {
  return summenBerechnen(a.positionen, a.rabatt).brutto;
}

function neueDokumentNummer() {
  const jahr = new Date().getFullYear();
  const nr = daten.einstellungen.naechsteNummer || 1;
  daten.einstellungen.naechsteNummer = nr + 1;
  return jahr + "-" + String(nr).padStart(3, "0");
}

/* ---------- Übersicht ---------- */
function renderUebersicht() {
  const a = daten.auftraege;
  const anzahl = (ids) => a.filter((x) => ids.includes(x.status)).length;
  const offeneRechnungen = a.filter((x) => x.status === "fertig");
  const offenerBetrag = offeneRechnungen.reduce((s, x) => s + auftragBrutto(x), 0);

  const heute = heuteISO();
  const termine = a
    .filter((x) => x.termin && x.termin >= heute && !["bezahlt"].includes(x.status))
    .sort((x, y) => x.termin.localeCompare(y.termin))
    .slice(0, 6);

  const zuletzt = [...a].sort((x, y) => (y.geaendertAm || "").localeCompare(x.geaendertAm || "")).slice(0, 5);

  let html = `
  <div class="kacheln">
    <button class="kachel" onclick="filterUndZeige('anfrage')"><div class="zahl">${anzahl(["anfrage", "angebot"])}</div><div class="beschriftung">Offene Anfragen / Angebote</div></button>
    <button class="kachel" onclick="filterUndZeige('beauftragt')"><div class="zahl">${anzahl(["beauftragt"])}</div><div class="beschriftung">Beauftragt / geplant</div></button>
    <button class="kachel" onclick="filterUndZeige('in_arbeit')"><div class="zahl">${anzahl(["in_arbeit"])}</div><div class="beschriftung">In Arbeit</div></button>
    <button class="kachel warn" onclick="filterUndZeige('fertig')"><div class="zahl">${euro(offenerBetrag)}</div><div class="beschriftung">Offene Rechnungen (${offeneRechnungen.length})</div></button>
  </div>

  <div class="zeile" style="margin-bottom:16px">
    <button class="primaer" onclick="auftragBearbeiten()">+ Neuer Auftrag</button>
    <button class="sekundaer" onclick="kundeBearbeiten()">+ Neuer Kunde</button>
  </div>

  <div class="karte">
    <h2>📅 Nächste Termine</h2>`;

  if (termine.length === 0) {
    html += `<div class="leer">Keine anstehenden Termine. Trage bei einem Auftrag einen Termin ein.</div>`;
  } else {
    html += termine.map((x) => auftragskarte(x, true)).join("");
  }
  html += `</div>

  <div class="karte">
    <h2>🕘 Zuletzt bearbeitet</h2>`;
  html += zuletzt.length === 0
    ? `<div class="leer">Noch keine Aufträge. Leg mit „+ Neuer Auftrag“ los${daten.kunden.length === 0 ? " – oder <a href=\"#\" onclick=\"beispieldatenLaden();return false\">Beispieldaten laden</a>, um dich umzusehen" : ""}.</div>`
    : zuletzt.map((x) => auftragskarte(x)).join("");
  html += `</div>`;
  return html;
}

function filterUndZeige(status) {
  auftragsFilter = status;
  zeige("auftraege");
}

/* ---------- Aufträge ---------- */
function auftragskarte(a, mitTermin) {
  const k = kunde(a.kundeId);
  const summe = auftragBrutto(a);
  return `
  <button class="listenkarte" onclick="auftragBearbeiten('${a.id}')">
    <div>
      <div class="titel">${esc(a.titel) || "(ohne Titel)"}</div>
      <div class="unterzeile">${k ? esc(k.name) : "Kein Kunde"}${a.termin ? " · " + datumFormat(a.termin) : ""}</div>
    </div>
    <div class="rechts">
      <span class="badge ${a.status}">${statusName(a.status)}</span>
      ${summe > 0 ? `<div class="summe">${euro(summe)}</div>` : ""}
    </div>
  </button>`;
}

function gefilterteAuftraege() {
  let liste = daten.auftraege.filter((a) => {
    if (auftragsFilter === "offen") { if (a.status === "bezahlt") return false; }
    else if (auftragsFilter !== "alle" && a.status !== auftragsFilter) return false;
    if (auftragsSuche) {
      const k = kunde(a.kundeId);
      const heuhaufen = (a.titel + " " + (a.beschreibung || "") + " " + (k ? k.name : "")).toLowerCase();
      if (!heuhaufen.includes(auftragsSuche.toLowerCase())) return false;
    }
    return true;
  });
  const reihenfolge = Object.fromEntries(STATUS.map((s, i) => [s.id, i]));
  liste.sort((a, b) => (reihenfolge[a.status] - reihenfolge[b.status]) || (a.termin || "9999").localeCompare(b.termin || "9999"));
  return liste;
}

function auftragslisteHtml() {
  const liste = gefilterteAuftraege();
  return liste.length === 0
    ? `<div class="leer karte">Keine Aufträge in dieser Ansicht.</div>`
    : liste.map((a) => auftragskarte(a)).join("");
}

}

function kundeSpeichern(id) {
  const name = document.getElementById("k-name").value.trim();
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const werte = {
    name,
    strasse: document.getElementById("k-strasse").value.trim(),
    plzOrt: document.getElementById("k-plzort").value.trim(),
    telefon: document.getElementById("k-telefon").value.trim(),
    email: document.getElementById("k-email").value.trim(),
    notizen: document.getElementById("k-notizen").value,
  };
  if (id) Object.assign(kunde(id), werte);
  else daten.kunden.push(Object.assign({ id: uid(), angelegtAm: heuteISO() }, werte));
  speichern();
  dialogSchliessen();
  render();
}

function kundeLoeschen(id) {
  const anzahl = daten.auftraege.filter((a) => a.kundeId === id).length;
  const frage = anzahl
    ? `Diesen Kunden und seine ${anzahl} Auftr${anzahl === 1 ? "ag" : "äge"} wirklich löschen?`
    : "Diesen Kunden wirklich löschen?";
  if (!confirm(frage)) return;
  daten.auftraege = daten.auftraege.filter((a) => a.kundeId !== id);
  daten.kunden = daten.kunden.filter((k) => k.id !== id);
  speichern();
  dialogSchliessen();
  render();
}

function auftragSpeichern(id) {
  const kundeId = document.getElementById("a-kunde").value;
  const titel = document.getElementById("a-titel").value.trim();
  if (!kundeId) { alert("Bitte einen Kunden wählen (oder zuerst anlegen)."); return; }
  if (!titel) { alert("Bitte einen Titel eingeben."); return; }

  const werte = {
    kundeId, titel,
    status: document.getElementById("a-status").value,
    termin: document.getElementById("a-termin").value,
    einsatzOrt: document.getElementById("a-einsatzort").value.trim(),
    zielOrt: document.getElementById("a-zielort").value.trim(),
    beschreibung: document.getElementById("a-beschreibung").value,
    material: document.getElementById("a-material").value,
    notizen: document.getElementById("a-notizen").value,
    positionen: bearbeitungsPositionen.filter((p) => p.bezeichnung.trim() !== ""),
    zeiten: bearbeitungsZeiten.filter((z) => z.datum),
    rabatt: { art: bearbeitungsRabatt.art, wert: Number(bearbeitungsRabatt.wert) || 0 },
    unterschrift: bearbeitungsUnterschrift,
    geaendertAm: new Date().toISOString(),
  };
  const vorher = id ? daten.auftraege.find((x) => x.id === id) : null;
  bezahltAmPflegen(werte, vorher);
  if (id) Object.assign(daten.auftraege.find((x) => x.id === id), werte);
  else daten.auftraege.push(Object.assign({ id: uid(), angelegtAm: heuteISO(), angebotNr: "", rechnungNr: "" }, werte));
  speichern();
  dialogSchliessen();
  render();
}

// Bestehenden Auftrag als Vorlage kopieren: Leistungen/Preise bleiben,
// alles Auftragsspezifische (Termin, Nummern, Fotos, Zeiten, Bezahlt)
// wird geleert. Öffnet den neuen Auftrag direkt zum Bearbeiten.
function auftragDuplizieren(id) {
  const alt = daten.auftraege.find((x) => x.id === id);
  if (!alt) return;
  // Erst den offenen Bearbeitungsstand sichern, damit Änderungen mitkopiert werden
  auftragSpeichernStill(id);
  const kopie = {
    id: uid(),
    kundeId: alt.kundeId,
    titel: (alt.titel || "").replace(/\s*\(Kopie\)$/, "") + " (Kopie)",
    beschreibung: alt.beschreibung || "",
    status: "anfrage",
    termin: "", einsatzOrt: alt.einsatzOrt || "", zielOrt: alt.zielOrt || "",
    positionen: JSON.parse(JSON.stringify(alt.positionen || [])),
    rabatt: Object.assign({ art: "prozent", wert: 0 }, alt.rabatt || {}),
    zeiten: [], material: alt.material || "", notizen: alt.notizen || "",
    fotos: [], unterschrift: "", angebotNr: "", rechnungNr: "", bezahltAm: "",
    angelegtAm: heuteISO(), geaendertAm: new Date().toISOString(),
  };
  daten.auftraege.push(kopie);
  speichern();
  dialogSchliessen();
  auftragBearbeiten(kopie.id);
}

function auftragLoeschen(id) {
  if (!confirm("Diesen Auftrag wirklich löschen?")) return;
  const a = daten.auftraege.find((x) => x.id === id);
  for (const f of (a && a.fotos) || []) {
    fotoLokalLoeschen(f.id).catch(() => {});
    if (serverMoeglich()) fetch(apiUrl("api/fotos/" + f.id), { method: "DELETE" }).catch(() => {});
  }
  daten.auftraege = daten.auftraege.filter((x) => x.id !== id);
  speichern();
  dialogSchliessen();
  render();
}

let usHatInhalt = false;
function unterschriftZeichnenEinrichten() {
  const canvas = document.getElementById("us-canvas");
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#0f172a";
  usHatInhalt = false;
  let zeichnet = false, letzteX = 0, letzteY = 0;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
  };
  const start = (e) => { e.preventDefault(); zeichnet = true; const q = pos(e); letzteX = q.x; letzteY = q.y; };
  const zeichne = (e) => {
    if (!zeichnet) return; e.preventDefault();
    const q = pos(e);
    ctx.beginPath(); ctx.moveTo(letzteX, letzteY); ctx.lineTo(q.x, q.y); ctx.stroke();
    letzteX = q.x; letzteY = q.y; usHatInhalt = true;
  };
  const ende = () => { zeichnet = false; };
  canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", zeichne);
  window.addEventListener("mouseup", ende);
  // window-Listener wieder entfernen, sobald der Unterschrift-Dialog schließt,
  // damit sich über die Sitzung keine veralteten Handler ansammeln
  dialog2.addEventListener("close", () => window.removeEventListener("mouseup", ende), { once: true });
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", zeichne, { passive: false });
  canvas.addEventListener("touchend", ende);
}

function unterschriftFeldLeeren() {
  const canvas = document.getElementById("us-canvas");
  canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  usHatInhalt = false;
}

function unterschriftUebernehmen() {
  if (!usHatInhalt) { alert("Bitte zuerst unterschreiben."); return; }
  bearbeitungsUnterschrift = document.getElementById("us-canvas").toDataURL("image/png");
  dialog2.close();
  unterschriftRendern();
}

function serieDatum(startISO, takt, index) {
  const d = new Date(startISO + "T00:00:00");
  if (takt === "month" || takt === "quarter") {
    // Monatssprung mit Tages-Begrenzung, damit z. B. der 31. nicht in den
    // Folgemonat überläuft (31.01 + 1 Monat → 28./29.02, nicht 03.03)
    const schritt = takt === "quarter" ? 3 : 1;
    const zielMonat = d.getMonth() + index * schritt;
    const jahr = d.getFullYear() + Math.floor(zielMonat / 12);
    const monat = ((zielMonat % 12) + 12) % 12;
    const letzterTag = new Date(jahr, monat + 1, 0).getDate();
    d.setFullYear(jahr, monat, Math.min(d.getDate(), letzterTag));
  } else {
    d.setDate(d.getDate() + index * Number(takt));
  }
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function serieAnlegen(id) {
  const a = daten.auftraege.find((x) => x.id === id);
  if (!a) return;
  const takt = document.getElementById("se-takt").value;
  const anzahl = Math.max(2, Math.min(60, Number(document.getElementById("se-anzahl").value) || 2));
  const start = document.getElementById("se-start").value || heuteISO();
  // Erster Termin an den bestehenden Auftrag
  a.termin = serieDatum(start, takt, 0);
  if (a.status === "anfrage" || a.status === "angebot") a.status = "beauftragt";
  a.geaendertAm = new Date().toISOString();
  // Folgetermine als Kopien
  for (let i = 1; i < anzahl; i++) {
    daten.auftraege.push({
      id: uid(), kundeId: a.kundeId, titel: a.titel, beschreibung: a.beschreibung || "",
      status: "beauftragt", termin: serieDatum(start, takt, i),
      einsatzOrt: a.einsatzOrt || "", zielOrt: a.zielOrt || "",
      positionen: JSON.parse(JSON.stringify(a.positionen || [])),
      rabatt: Object.assign({ art: "prozent", wert: 0 }, a.rabatt || {}),
      zeiten: [], material: a.material || "", notizen: a.notizen || "",
      fotos: [], unterschrift: "", angebotNr: "", rechnungNr: "", bezahltAm: "",
      serie: true, angelegtAm: heuteISO(), geaendertAm: new Date().toISOString(),
    });
  }
  speichern();
  dialog2.close();
  dialogSchliessen();
  alert(anzahl + " Termine angelegt.");
  zeige("termine");
}

/* =========================================================
   Stundenzettel (Arbeitszeiten je Auftrag)
   ========================================================= */
function zeitDauerStunden(z) {
  if (!z.von || !z.bis) return 0;
  const [vh, vm] = z.von.split(":").map(Number);
  const [bh, bm] = z.bis.split(":").map(Number);
  let minuten = (bh * 60 + bm) - (vh * 60 + vm);
  if (minuten < 0) minuten += 24 * 60; // über Mitternacht
  return minuten / 60;
}

function zeitenSummeStunden() {
  return bearbeitungsZeiten.reduce((s, z) => s + zeitDauerStunden(z), 0);
}

function zeitenRendern() {
  const ziel = document.getElementById("a-zeiten");
  if (!ziel) return;
  ziel.innerHTML = bearbeitungsZeiten.map((z, i) => {
    const dauer = zeitDauerStunden(z);
    return `
    <div class="zeitzeile">
      <input class="z-datum" type="date" value="${esc(z.datum)}" onchange="zeitAendern(${i},'datum',this.value)">
      <input class="z-zeit" type="time" value="${esc(z.von)}" onchange="zeitAendern(${i},'von',this.value)">
      <span>–</span>
      <input class="z-zeit" type="time" value="${esc(z.bis)}" onchange="zeitAendern(${i},'bis',this.value)">
      <span class="z-dauer">${dauer ? dauer.toFixed(2).replace(".", ",") + " Std." : "–"}</span>
      <button class="pos-loeschen" title="Zeit entfernen" onclick="zeitEntfernen(${i})">🗑</button>
    </div>`;
  }).join("");
  const summe = zeitenSummeStunden();
  if (bearbeitungsZeiten.length) {
    ziel.innerHTML += `<div class="zeit-summe">Summe: <strong>${summe.toFixed(2).replace(".", ",")} Std.</strong>
      ${daten.einstellungen.stundensatz ? "· als Position: " + euro(summe * daten.einstellungen.stundensatz) : ""}
      <button class="sekundaer klein" onclick="zeitenAlsPosition()">→ als Position übernehmen</button></div>`;
  }
  const uhr = document.getElementById("a-stoppuhr");
  if (uhr) {
    if (stoppuhrStart) {
      const min = Math.floor((Date.now() - stoppuhrStart) / 60000);
      uhr.textContent = "⏹ Stoppen (" + Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0") + ")";
      uhr.classList.add("stoppuhr-laeuft");
    } else {
      uhr.textContent = "▶ Stoppuhr";
      uhr.classList.remove("stoppuhr-laeuft");
    }
  }
}

function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

function zeitHinzufuegen() {
  const jetzt = new Date();
  bearbeitungsZeiten.push({ datum: heuteISO(), von: hhmm(jetzt), bis: hhmm(jetzt) });
  zeitenRendern();
}

function zeitAendern(i, feld, wert) {
  bearbeitungsZeiten[i][feld] = wert;
  zeitenRendern();
}

function zeitEntfernen(i) {
  bearbeitungsZeiten.splice(i, 1);
  zeitenRendern();
}

function stoppuhrKlick() {
  if (stoppuhrStart) {
    const start = new Date(stoppuhrStart);
    const ende = new Date();
    bearbeitungsZeiten.push({ datum: heuteISO(), von: hhmm(start), bis: hhmm(ende) });
    stoppuhrStart = null;
    clearInterval(stoppuhrTimer); stoppuhrTimer = null;
  } else {
    stoppuhrStart = Date.now();
    stoppuhrTimer = setInterval(() => { const u = document.getElementById("a-stoppuhr"); if (u) zeitenRendern(); else { clearInterval(stoppuhrTimer); stoppuhrTimer = null; } }, 30000);
  }
  zeitenRendern();
}

function zeitenAlsPosition() {
  const summe = zeitenSummeStunden();
  if (!summe) { alert("Noch keine Zeiten mit Dauer erfasst."); return; }
  const stundenGerundet = Math.round(summe * 100) / 100;
  if (bearbeitungsPositionen.length === 1 && !bearbeitungsPositionen[0].bezeichnung.trim()) bearbeitungsPositionen = [];
  bearbeitungsPositionen.push({ bezeichnung: "Arbeitszeit", menge: stundenGerundet, einheit: "Std.", preis: daten.einstellungen.stundensatz || "" });
  positionenRendern();
  alert("Arbeitszeit (" + stundenGerundet.toFixed(2).replace(".", ",") + " Std.) als Position übernommen.");
}

// Beim Wechsel auf „Bezahlt“ das Bezahldatum setzen (für die Umsatzübersicht),
// beim Zurücknehmen wieder entfernen
function bezahltAmPflegen(werte, vorher) {
  if (werte.status === "bezahlt") {
    werte.bezahltAm = (vorher && vorher.bezahltAm) || heuteISO();
  } else {
    werte.bezahltAm = "";
  }
}

/* =========================================================
   Terminkalender
   ========================================================= */
let kalenderMonat = null; // {jahr, monat} — null = aktueller Monat

function renderTermine() {
  const heute = new Date();
  if (!kalenderMonat) kalenderMonat = { jahr: heute.getFullYear(), monat: heute.getMonth() };
  const { jahr, monat } = kalenderMonat;
  const monatsName = new Date(jahr, monat, 1).toLocaleDateString("de-DE", { month: "long", year: "numeric" });

  // Termine dieses Monats nach Tag gruppieren
  const proTag = {};
  for (const a of daten.auftraege) {
    if (!a.termin) continue;
    const d = new Date(a.termin + "T00:00:00");
    if (d.getFullYear() === jahr && d.getMonth() === monat) {
      (proTag[d.getDate()] = proTag[d.getDate()] || []).push(a);
    }
  }

  const ersterWochentag = (new Date(jahr, monat, 1).getDay() + 6) % 7; // Mo=0
  const tageImMonat = new Date(jahr, monat + 1, 0).getDate();
  const heuteISOstr = heuteISO();

  let zellen = "";
  for (let i = 0; i < ersterWochentag; i++) zellen += `<div class="kal-tag leer"></div>`;
  for (let tag = 1; tag <= tageImMonat; tag++) {
    const iso = jahr + "-" + String(monat + 1).padStart(2, "0") + "-" + String(tag).padStart(2, "0");
    const eintraege = proTag[tag] || [];
    zellen += `<div class="kal-tag ${iso === heuteISOstr ? "heute" : ""}">
      <div class="tagzahl">${tag}</div>
      ${eintraege.map((a) => `<button class="kal-punkt" title="${esc(a.titel)}" onclick="auftragBearbeiten('${a.id}')">${esc(a.titel)}</button>`).join("")}
    </div>`;
  }

  const kommende = daten.auftraege
    .filter((a) => a.termin && a.termin >= heuteISOstr && a.status !== "bezahlt")
    .sort((x, y) => x.termin.localeCompare(y.termin)).slice(0, 8);

  return `
  <div class="karte">
    <div class="kal-kopf">
      <button class="sekundaer klein" onclick="kalenderBlaettern(-1)">‹</button>
      <h2>${monatsName}</h2>
      <button class="sekundaer klein" onclick="kalenderBlaettern(1)">›</button>
    </div>
    <div class="kal-gitter">
      ${["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map((w) => `<div class="kal-wtag">${w}</div>`).join("")}
      ${zellen}
    </div>
    <div style="text-align:center;margin-top:10px"><button class="sekundaer klein" onclick="kalenderMonat=null;render()">Heute</button></div>
  </div>
  <div class="karte">
    <h2>Als Nächstes</h2>
    ${kommende.length ? kommende.map((a) => auftragskarte(a, true)).join("") : `<div class="leer">Keine anstehenden Termine.</div>`}
  </div>`;
}

function kalenderBlaettern(richtung) {
  if (!kalenderMonat) { const h = new Date(); kalenderMonat = { jahr: h.getFullYear(), monat: h.getMonth() }; }
  let m = kalenderMonat.monat + richtung, j = kalenderMonat.jahr;
  if (m < 0) { m = 11; j--; } else if (m > 11) { m = 0; j++; }
  kalenderMonat = { jahr: j, monat: m };
  render();
}

/* =========================================================
   Umsatzübersicht
   ========================================================= */
function renderUmsatz() {
  const jahr = (new Date()).getFullYear();
  // Bezahlt = Einnahmen im Bezahlmonat; offen = fertige, noch nicht bezahlte Rechnungen
  const monate = Array.from({ length: 12 }, () => ({ bezahlt: 0 }));
  let offen = 0, jahrBezahlt = 0;
  for (const a of daten.auftraege) {
    const brutto = auftragBrutto(a);
    if (a.status === "bezahlt" && a.bezahltAm) {
      const d = new Date(a.bezahltAm + "T00:00:00");
      if (d.getFullYear() === jahr) { monate[d.getMonth()].bezahlt += brutto; jahrBezahlt += brutto; }
    } else if (a.status === "fertig") {
      offen += brutto;
    }
  }
  const maxWert = Math.max(1, ...monate.map((m) => m.bezahlt));
  const monatsNamen = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

  return `
  <div class="kacheln">
    <div class="kachel"><div class="zahl">${euro(jahrBezahlt)}</div><div class="beschriftung">Bezahlt in ${jahr}</div></div>
    <button class="kachel warn" onclick="filterUndZeige('fertig')"><div class="zahl">${euro(offen)}</div><div class="beschriftung">Offene Rechnungen</div></button>
  </div>
  <div class="karte">
    <h2>Bezahlte Rechnungen ${jahr} nach Monat</h2>
    <table class="umsatz-tabelle">
      <thead><tr><th>Monat</th><th>Bezahlt</th><th style="width:40%"></th></tr></thead>
      <tbody>
        ${monate.map((m, i) => `<tr>
          <td>${monatsNamen[i]}</td>
          <td>${m.bezahlt ? euro(m.bezahlt) : "–"}</td>
          <td><div class="umsatz-balken" style="width:${Math.round(m.bezahlt / maxWert * 100)}%"></div></td>
        </tr>`).join("")}
        <tr class="gesamt"><td>Gesamt</td><td>${euro(jahrBezahlt)}</td><td></td></tr>
      </tbody>
    </table>
    <div class="hinweis">„Bezahlt“ zählt ab dem Tag, an dem du den Auftrag auf „Bezahlt“ gesetzt hast. Keine Steuerberatung — nur ein Überblick.</div>
  </div>`;
}

/* =========================================================
   Angebot / Rechnung: Daten sammeln, PDF erzeugen, teilen
   ========================================================= */
// Zeichen, die WinAnsi/Latin-1 nicht kennt, lesbar auf Grundbuchstaben
// abbilden — sonst stünde in kundenseitigen PDFs „?“ statt z. B. „Yılmaz“.
const TRANSLIT = {
  "ı": "i", "İ": "I", "ğ": "g", "Ğ": "G", "ş": "s", "Ş": "S",
  "ł": "l", "Ł": "L", "ą": "a", "Ą": "A", "ę": "e", "Ę": "E",
  "ż": "z", "Ż": "Z", "ź": "z", "Ź": "Z", "ć": "c", "Ć": "C",
  "ń": "n", "Ń": "N", "ś": "s", "Ś": "S",
  "č": "c", "Č": "C", "š": "s", "Š": "S", "ž": "z", "Ž": "Z",
  "ř": "r", "Ř": "R", "ě": "e", "Ě": "E", "ů": "u", "Ů": "U",
  "đ": "d", "Đ": "D",
};

// Zeichen nach WinAnsi (Latin-1 + € auf 0x80) für die PDF-Schrift Helvetica
function winAnsiBytes(text) {
  const bytes = [];
  for (const zeichen of String(text)) {
    const cp = zeichen.codePointAt(0);
    if (zeichen === "€") bytes.push(0x80);
    else if (cp === 0x2013 || cp === 0x2014) bytes.push(0x2D); // – — → -
    else if (cp === 0x201E || cp === 0x201C || cp === 0x201D) bytes.push(0x22); // „ " " → "
    else if (cp === 0x2018 || cp === 0x2019) bytes.push(0x27); // ' ' → '
    else if (cp === 0x2026) { bytes.push(0x2E, 0x2E, 0x2E); }   // … → ...
    else if (cp <= 0xFF) bytes.push(cp);
    else if (TRANSLIT[zeichen]) for (const c of TRANSLIT[zeichen]) bytes.push(c.charCodeAt(0));
    else bytes.push(0x3F); // unbekannt → ?
  }
  return bytes;
}

function pdfEscape(text) {
  return String(text).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
}

function bytesZuLatin1(bytes) { return bytes.map((b) => String.fromCharCode(b)).join(""); }

// Ein PNG-Daten-URL (Unterschrift) in JPEG-Bytes auf weißem Grund wandeln —
// JPEG lässt sich per DCTDecode direkt in die PDF einbetten.
function bildAlsJpegBytes(dataUrl, jw, jh) {
  return new Promise((aufloesen, ablehnen) => {
    const bild = new Image();
    bild.onload = () => {
      const c = document.createElement("canvas");
      c.width = jw; c.height = jh;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, jw, jh);
      ctx.drawImage(bild, 0, 0, jw, jh);
      const b64 = c.toDataURL("image/jpeg", 0.85).split(",")[1];
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      aufloesen({ bytes, jw, jh });
    };
    bild.onerror = () => ablehnen(new Error("Unterschrift-Bild nicht lesbar"));
    bild.src = dataUrl;
  });
}

// Bild-Zeilen (mit .bild = dataUrl) vorab zu JPEG-Bytes auflösen (über alle Seiten)
async function pdfBilderVorbereiten(seiten) {
  for (const zeilen of seiten) {
    for (const z of zeilen) {
      if (z.bild) {
        try { z.jpeg = await bildAlsJpegBytes(z.bild, 360, 110); }
        catch { z.jpeg = null; }
      }
    }
  }
  return seiten;
}

// Gültiger PDF-Erzeuger (A4, Helvetica; mehrere Seiten; optional eingebettete
// JPEG-Bilder). seiten: Array von Seiten, je Seite {text,x,y,size,bold} oder {jpeg,x,y,w,h}
function pdfErzeugen(seiten) {
  // Objekte dynamisch nummerieren; jedes Objekt ist ein String oder
  // { header, bytes, footer } (für binäre Bild-Streams).
  const objs = [];
  const add = (o) => { objs.push(o); return objs.length; }; // 1-basierte Objektnummer
  add("PLATZHALTER_CATALOG"); // 1
  add("PLATZHALTER_PAGES");   // 2
  const fontF1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const fontF2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");

  const seitenObjNummern = [];
  for (const zeilen of seiten) {
    const bilder = zeilen.filter((z) => z.jpeg && z.jpeg.bytes);
    const bildNummern = bilder.map((b) => add({
      header: `<< /Type /XObject /Subtype /Image /Width ${b.jpeg.jw} /Height ${b.jpeg.jh} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${b.jpeg.bytes.length} >>\nstream\n`,
      bytes: b.jpeg.bytes, footer: "\nendstream",
    }));
    let inhalt = "";
    for (const z of zeilen) {
      if (z.jpeg && z.jpeg.bytes) {
        const idx = bilder.indexOf(z);
        inhalt += `q ${z.w} 0 0 ${z.h} ${z.x} ${z.y} cm /Im${idx} Do Q\n`;
      } else if (z.text !== undefined) {
        const font = z.bold ? "F2" : "F1";
        inhalt += `BT /${font} ${z.size || 10} Tf ${z.x} ${z.y} Td (${pdfEscape(bytesZuLatin1(winAnsiBytes(z.text)))}) Tj ET\n`;
      }
    }
    const inhaltNum = add(`<< /Length ${winAnsiBytes(inhalt).length} >>\nstream\n${inhalt}endstream`);
    const xobj = bilder.length ? "/XObject << " + bildNummern.map((n, i) => `/Im${i} ${n} 0 R`).join(" ") + " >>" : "";
    seitenObjNummern.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontF1} 0 R /F2 ${fontF2} 0 R >> ${xobj} >> /Contents ${inhaltNum} 0 R >>`));
  }

  objs[0] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[1] = `<< /Type /Pages /Kids [${seitenObjNummern.map((n) => n + " 0 R").join(" ")}] /Count ${seitenObjNummern.length} >>`;

  // PDF byteweise aufbauen (Bilder sind binär)
  const teile = [];
  let laenge = 0;
  const offsets = [];
  const dazu = (s) => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xFF; teile.push(b); laenge += b.length; };

  dazu("%PDF-1.4\n");
  objs.forEach((o, i) => {
    offsets.push(laenge);
    if (typeof o === "string") { dazu(`${i + 1} 0 obj\n${o}\nendobj\n`); }
    else { dazu(`${i + 1} 0 obj\n${o.header}`); teile.push(o.bytes); laenge += o.bytes.length; dazu(`${o.footer}\nendobj\n`); }
  });
  const xrefStart = laenge;
  dazu(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`);
  for (const off of offsets) dazu(String(off).padStart(10, "0") + " 00000 n \n");
  dazu(`trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
  return new Blob(teile, { type: "application/pdf" });
}

// Sammelt die Zeilen für Angebot/Rechnung als PDF-Layout — gibt ein
// Array von Seiten zurück (Seitenumbruch bei vielen Positionen).
function dokumentPdfZeilen(a, art, nummer) {
  const e = daten.einstellungen;
  const k = kunde(a.kundeId);
  const sum = summenBerechnen(a.positionen, a.rabatt);
  const heute = new Date().toLocaleDateString("de-DE");
  const firmaName = e.firma || (BRANCHEN[e.branche] ? BRANCHEN[e.branche].name : "Betrieb");
  const seiten = [[]];
  let s = 0;
  const zu = (obj) => seiten[s].push(obj);
  const tabellenkopf = (yy) => {
    zu({ text: "Pos.", x: 50, y: yy, size: 9, bold: true });
    zu({ text: "Leistung", x: 85, y: yy, size: 9, bold: true });
    zu({ text: "Menge", x: 330, y: yy, size: 9, bold: true });
    zu({ text: "Einzel", x: 410, y: yy, size: 9, bold: true });
    zu({ text: "Gesamt", x: 490, y: yy, size: 9, bold: true });
  };

  // Kopf rechts: Firmendaten
  [firmaName, e.inhaber ? "Inhaber: " + e.inhaber : "", e.strasse, e.plzOrt, e.telefon ? "Tel.: " + e.telefon : "", e.email]
    .filter(Boolean).forEach((zeile, i) => zu({ text: zeile, x: 350, y: 800 - i * 13, size: 9, bold: i === 0 }));
  // Absender + Empfänger links
  zu({ text: [firmaName, e.strasse, e.plzOrt].filter(Boolean).join(" · "), x: 50, y: 800, size: 7 });
  let y = 770;
  if (k) [k.name, k.strasse, k.plzOrt].filter(Boolean).forEach((zeile) => { zu({ text: zeile, x: 50, y, size: 11 }); y -= 15; });
  // Titel
  y = 690;
  zu({ text: (art === "angebot" ? "Angebot" : "Rechnung") + " Nr. " + nummer, x: 50, y, size: 17, bold: true });
  y -= 20;
  zu({ text: "Datum: " + heute + (a.titel ? "   ·   " + a.titel : ""), x: 50, y, size: 10 });
  if (a.einsatzOrt) { y -= 14; zu({ text: (a.zielOrt ? "Von: " + a.einsatzOrt + "   Nach: " + a.zielOrt : "Einsatzort: " + a.einsatzOrt), x: 50, y, size: 9 }); }
  // Positionstabelle
  y -= 30;
  tabellenkopf(y);
  y -= 22;
  (a.positionen || []).forEach((p, i) => {
    if (y < 120) { // Seite voll → neue Seite mit Tabellenkopf
      seiten.push([]); s++; y = 800; tabellenkopf(y); y -= 22;
    }
    const g = aufCent((Number(p.menge) || 0) * (Number(p.preis) || 0));
    zu({ text: String(i + 1), x: 50, y, size: 9 });
    zu({ text: (p.bezeichnung || "").slice(0, 48), x: 85, y, size: 9 });
    zu({ text: p.menge + " " + p.einheit, x: 330, y, size: 9 });
    zu({ text: euro(Number(p.preis) || 0), x: 410, y, size: 9 });
    zu({ text: euro(g), x: 490, y, size: 9 });
    y -= 16;
  });
  // Summen (brauchen ~90 pt inkl. Schlusstext); ggf. neue Seite
  y -= 12;
  if (y < 200) { seiten.push([]); s++; y = 780; }
  if (sum.rabattBetrag) {
    zu({ text: "Zwischensumme: " + euro(sum.nettoRoh), x: 380, y, size: 10 });
    y -= 13; zu({ text: "Rabatt: -" + euro(sum.rabattBetrag), x: 380, y, size: 10 });
    y -= 13;
  }
  if (e.kleinunternehmer) {
    zu({ text: "Gesamtbetrag: " + euro(sum.netto), x: 350, y, size: 12, bold: true });
    y -= 14; zu({ text: "Kein USt-Ausweis (§ 19 UStG)", x: 350, y, size: 8 });
  } else {
    zu({ text: "Netto: " + euro(sum.netto), x: 400, y, size: 10 });
    y -= 14; zu({ text: "zzgl. " + e.mwst + " % USt: " + euro(sum.ust), x: 400, y, size: 10 });
    y -= 16; zu({ text: "Gesamtbetrag: " + euro(sum.brutto), x: 400, y, size: 12, bold: true });
  }
  // Schlusstext (nicht unter die Fußzeile/Unterschrift rutschen lassen)
  y -= 40;
  const schluss = art === "angebot"
    ? "Dieses Angebot ist 30 Tage gültig. Ich freue mich auf Ihren Auftrag!"
    : "Bitte überweisen Sie den Betrag innerhalb von " + (e.zahlungsziel || 14) + " Tagen. Vielen Dank!";
  zu({ text: schluss, x: 50, y: Math.max(y, 175), size: 10 });
  // Unterschrift (Abnahme) rechts unten auf der letzten Seite
  if (a.unterschrift) {
    zu({ bild: a.unterschrift, x: 350, y: 95, w: 180, h: 55 });
    zu({ text: "Unterschrift Kunde", x: 350, y: 88, size: 7 });
  }
  const fuss = [firmaName, e.steuernummer ? "Steuernummer: " + e.steuernummer : "", e.iban ? "IBAN: " + e.iban : ""].filter(Boolean).join("   ·   ");
  zu({ text: fuss, x: 50, y: 60, size: 8 });
  return seiten;
}

// Vergibt (einmalig) die Dokumentnummer und liefert sie zurück
function dokumentNummerSichern(a, art) {
  const feld = art === "angebot" ? "angebotNr" : "rechnungNr";
  if (!a[feld]) { a[feld] = neueDokumentNummer(); speichern(); }
  return a[feld];
}

function dokumentAusgeben(id, art) {
  auftragSpeichernStill(id);
  const a = daten.auftraege.find((x) => x.id === id);
  if (!a) return;
  if (!a.positionen || a.positionen.length === 0) { alert("Bitte zuerst mindestens eine Position mit Leistung eintragen."); return; }
  const artName = art === "angebot" ? "Angebot" : "Rechnung";
  // Belegnummer NICHT schon beim Öffnen des Menüs vergeben — sonst entstehen
  // Lücken in der fortlaufenden Nummerierung, wenn der Nutzer abbricht.
  // Die Nummer wird erst in dokumentPdfBlob / dokumentDrucken gesichert.
  const nummer = art === "angebot" ? a.angebotNr : a.rechnungNr;
  const kannTeilen = typeof navigator !== "undefined" && navigator.canShare &&
    navigator.canShare({ files: [new File([new Blob(["x"])], "t.pdf", { type: "application/pdf" })] });

  dialog2.innerHTML = `
  <div class="dialog-kopf">
    <h2>${artName}${nummer ? " Nr. " + esc(nummer) : ""}</h2>
    <button class="schliessen" onclick="dialog2.close()" aria-label="Schließen">×</button>
  </div>
  <div class="dialog-inhalt">
    <p>Wie möchtest du das ${artName} ausgeben?</p>
    <div class="zeile" style="flex-direction:column;align-items:stretch;gap:10px">
      <button class="primaer" onclick="dokumentTeilen('${id}','${art}')">📲 Als PDF teilen (WhatsApp, E-Mail …)</button>
      <button class="sekundaer" onclick="dokumentPdfHerunterladen('${id}','${art}')">💾 PDF herunterladen</button>
      <button class="sekundaer" onclick="dialog2.close();dokumentDrucken('${id}','${art}')">🖨️ Drucken (Browser)</button>
    </div>
    ${kannTeilen ? "" : `<div class="hinweis">„Teilen“ öffnet auf dem Handy die App-Auswahl. Auf diesem Gerät steht es evtl. nicht zur Verfügung — dann PDF herunterladen und selbst anhängen.</div>`}
  </div>`;
  dialog2.showModal();
}

async function dokumentPdfBlob(id, art) {
  const a = daten.auftraege.find((x) => x.id === id);
  const nummer = dokumentNummerSichern(a, art);
  const zeilen = await pdfBilderVorbereiten(dokumentPdfZeilen(a, art, nummer));
  return { blob: pdfErzeugen(zeilen), name: (art === "angebot" ? "Angebot" : "Rechnung") + "-" + nummer + ".pdf" };
}

async function dokumentTeilen(id, art) {
  const { blob, name } = await dokumentPdfBlob(id, art);
  const datei = new File([blob], name, { type: "application/pdf" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: name });
      dialog2.close();
      return;
    }
  } catch (fehler) {
    if (fehler && fehler.name === "AbortError") return; // Nutzer hat abgebrochen
  }
  dokumentPdfHerunterladen(id, art);
}

async function dokumentPdfHerunterladen(id, art) {
  const { blob, name } = await dokumentPdfBlob(id, art);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  dialog2.close();
}

/* =========================================================
   Angebot / Rechnung drucken
   ========================================================= */
function dokumentDrucken(id, art) {
  // Erst speichern, damit der Ausdruck den aktuellen Stand zeigt
  auftragSpeichernStill(id);
  const a = daten.auftraege.find((x) => x.id === id);
  if (!a) return;
  if (!a.positionen || a.positionen.length === 0) { alert("Bitte zuerst mindestens eine Position mit Leistung eintragen."); return; }

  const e = daten.einstellungen;
  const k = kunde(a.kundeId);

/* =========================================================
   Fotos — lokal im Browser (IndexedDB), Abgleich mit dem PC
   ========================================================= */
let fotoDbVersprechen = null;
function fotoDb() {
  if (!fotoDbVersprechen) {
    fotoDbVersprechen = new Promise((aufloesen, ablehnen) => {
      const anfrage = indexedDB.open("maler-fotos", 1);
      anfrage.onupgradeneeded = () => anfrage.result.createObjectStore("fotos", { keyPath: "id" });
      anfrage.onsuccess = () => aufloesen(anfrage.result);
      anfrage.onerror = () => ablehnen(anfrage.error);
    });
  }
  return fotoDbVersprechen;
}

function fotoDbAktion(modus, arbeit) {
  return fotoDb().then((db) => new Promise((aufloesen, ablehnen) => {
    const tx = db.transaction("fotos", modus);
    const anfrage = arbeit(tx.objectStore("fotos"));
    anfrage.onsuccess = () => aufloesen(anfrage.result);
    anfrage.onerror = () => ablehnen(anfrage.error);
  }));
}

const fotoLokalSpeichern = (eintrag) => fotoDbAktion("readwrite", (s) => s.put(eintrag));
const fotoLokalHolen = (id) => fotoDbAktion("readonly", (s) => s.get(id));
const fotoLokalLoeschen = (id) => fotoDbAktion("readwrite", (s) => s.delete(id));
const fotoAlleLokal = () => fotoDbAktion("readonly", (s) => s.getAll());

// Foto verkleinern (max. 1600 px, JPEG) — spart Speicher und Übertragungszeit
function fotoVerkleinern(datei) {
  return new Promise((aufloesen, ablehnen) => {
    const bild = new Image();
    bild.onload = () => {
      const faktor = Math.min(1, 1600 / Math.max(bild.width, bild.height));
      const leinwand = document.createElement("canvas");
      leinwand.width = Math.round(bild.width * faktor);
      leinwand.height = Math.round(bild.height * faktor);
      leinwand.getContext("2d").drawImage(bild, 0, 0, leinwand.width, leinwand.height);
      URL.revokeObjectURL(bild.src);
      leinwand.toBlob((blob) => blob ? aufloesen(blob) : ablehnen(new Error("Bild konnte nicht verarbeitet werden")), "image/jpeg", 0.82);
    };
    bild.onerror = () => ablehnen(new Error("Datei ist kein lesbares Bild"));
    bild.src = URL.createObjectURL(datei);
  });
}

async function fotoHinzufuegen(eingabe, auftragId) {
  const a = daten.auftraege.find((x) => x.id === auftragId);
  if (!a) return;
  a.fotos = a.fotos || [];
  for (const datei of eingabe.files) {
    try {
      const blob = await fotoVerkleinern(datei);
      const id = uid();
      await fotoLokalSpeichern({ id, blob, hochgeladen: false });
      a.fotos.push({ id, am: heuteISO() });
    } catch (fehler) {
      alert("Foto konnte nicht übernommen werden: " + fehler.message);
    }
  }
  eingabe.value = "";
  a.geaendertAm = new Date().toISOString();
  speichern();
  fotosRendern(a);
}

async function fotoEntfernen(auftragId, fotoId) {
  if (!confirm("Dieses Foto löschen?")) return;
  const a = daten.auftraege.find((x) => x.id === auftragId);
  if (!a) return;
  a.fotos = (a.fotos || []).filter((f) => f.id !== fotoId);
  speichern();
  fotoLokalLoeschen(fotoId).catch(() => {});
  if (serverMoeglich()) fetch(apiUrl("api/fotos/" + fotoId), { method: "DELETE" }).catch(() => {});
  fotosRendern(a);
}

async function fotosRendern(a) {
  const behaelter = document.getElementById("a-fotos");
  if (!behaelter) return;
  const fotos = a.fotos || [];
  behaelter.innerHTML = fotos.map((f) => `
    <div class="fotokachel">
      <img id="foto-${f.id}" alt="Baustellenfoto vom ${datumFormat(f.am)}" title="Aufgenommen am ${datumFormat(f.am)}">
      <button class="foto-loeschen" title="Foto löschen" onclick="fotoEntfernen('${a.id}','${f.id}')">×</button>
    </div>`).join("");
  for (const f of fotos) {
    const bild = document.getElementById("foto-" + f.id);
    if (!bild) continue;
    try {
      const lokal = await fotoLokalHolen(f.id);
      bild.src = lokal ? URL.createObjectURL(lokal.blob) : (serverMoeglich() ? apiUrl("api/fotos/" + f.id) : "");
    } catch {
      if (serverMoeglich()) bild.src = apiUrl("api/fotos/" + f.id);
    }
    bild.onclick = () => {
      document.getElementById("lightbox-bild").src = bild.src;
      document.getElementById("lightbox").classList.add("offen");
    };
  }
}

// Noch nicht übertragene Fotos zum PC hochladen (läuft im Hintergrund)
let fotoSyncLaeuft = false;
async function fotoSync() {
  if (!serverMoeglich() || !serverAktiv || fotoSyncLaeuft) return;
  fotoSyncLaeuft = true;
  try {
    const alle = await fotoAlleLokal();
    for (const eintrag of alle.filter((x) => !x.hochgeladen)) {
      const datenUrl = await new Promise((aufloesen, ablehnen) => {
        const leser = new FileReader();
        leser.onload = () => aufloesen(leser.result);
        leser.onerror = () => ablehnen(leser.error);
        leser.readAsDataURL(eintrag.blob);
      });
      const antwort = await fetchMitLimit(apiUrl("api/fotos"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: eintrag.id, datenUrl }),
      });
      if (!antwort.ok) break;
      eintrag.hochgeladen = true;
      await fotoLokalSpeichern(eintrag);
    }
  } catch { /* nächster Abgleich versucht es erneut */ }
  fotoSyncLaeuft = false;
}

/* =========================================================
   Notiz-Assistent — Notizen in Angebots-Positionen verwandeln
   ========================================================= */
const EINHEIT_ERKENNUNG = [
  [/^(m²|m2|qm)$/i, "m²"],
  [/^(m³|m3|cbm|kubikmeter)$/i, "m³"],
  [/^(std\.?|stunden?|h)$/i, "Std."],
  [/^(stk\.?|stück)$/i, "Stk."],
  [/^lfm$/i, "lfm"],
  [/^km$/i, "km"],
  [/^kg$/i, "kg"],
  [/^kartons?$/i, "Karton"],
  [/^fahrt(en)?$/i, "Fahrt"],
  [/^tage?$/i, "Tag"],
  [/^(liter|l)$/i, "Liter"],
  [/^pausch(al|\.)?$/i, "pausch."],
];

function zahlDe(text) { return Number(String(text).replace(",", ".")); }

// Eine Notizzeile wie „Wohnzimmer Wände 62 m² streichen à 12,50“ zerlegen.
// Zeilen ohne Mengen- oder Preisangabe gelten als Beschreibung und werden übersprungen.
function zeileZuPosition(zeile) {
  const mengeTreffer = zeile.match(/(\d+(?:[.,]\d+)?)\s*(m²|m2|qm|m³|m3|cbm|kubikmeter|std\.?|stunden?|stk\.?|stück|lfm|liter|kartons?|fahrten?|tage?|km|kg|pausch(?:al|\.)?|h|l)(?![a-zäöü])/i);
  // Preis nur bei eindeutigem Signal: „à 12,50“ oder Betrag mit €/EUR („45 €“).
  // „je 8 Std“ ist eine Menge, kein Preis.
  const preisTreffer = zeile.match(/à\s*(\d+(?:[.,]\d+)?)|(\d+(?:[.,]\d+)?)\s*(?:€|eur(?![a-zäöü]))/i);
  if (!mengeTreffer && !preisTreffer) return null;

  let einheit = "pausch.";
  if (mengeTreffer) {
    for (const [muster, name] of EINHEIT_ERKENNUNG) {
      if (muster.test(mengeTreffer[2])) { einheit = name; break; }
    }
  }
  const menge = mengeTreffer ? zahlDe(mengeTreffer[1]) : 1;

  let preis = preisTreffer ? zahlDe(preisTreffer[1] ?? preisTreffer[2]) : "";
  let quelle = preisTreffer ? "aus Notiz" : "";
  if (preis === "" || isNaN(preis)) {
    const klein = zeile.toLowerCase();
    const eintrag = (daten.einstellungen.preisliste || []).find((p) => p.begriff && klein.includes(p.begriff.toLowerCase()));
    if (eintrag) { preis = Number(eintrag.preis) || ""; quelle = "Preisliste „" + eintrag.begriff + "“"; }
    else if (einheit === "Std.") { preis = Number(daten.einstellungen.stundensatz) || ""; quelle = "Stundensatz"; }
    else { preis = ""; quelle = "bitte ergänzen"; }
  }

  let bezeichnung = zeile;
  if (mengeTreffer) bezeichnung = bezeichnung.replace(mengeTreffer[0], " ");
  if (preisTreffer) bezeichnung = bezeichnung.replace(preisTreffer[0], " ");
  bezeichnung = bezeichnung.replace(/[,;:–-]\s*$/g, "").replace(/\s{2,}/g, " ").trim();
  if (!bezeichnung) bezeichnung = zeile.trim();

  return { bezeichnung, menge, einheit, preis, quelle };
}

function notizenZuPositionen(text) {
  return String(text || "").split(/\n/).map((z) => zeileZuPosition(z.trim())).filter(Boolean);
}

    besonders bevor du den Browser-Verlauf/Websitedaten löschst oder das Gerät wechselst.</p>
    <div class="zeile">
      <button class="sekundaer" onclick="sicherungExportieren()">Sicherung herunterladen</button>
      <button class="sekundaer" onclick="document.getElementById('e-import').click()">Sicherung einspielen</button>
      <input type="file" id="e-import" accept=".json,application/json" style="display:none" onchange="sicherungImportieren(this)">
    </div>
  </div>

  <div class="karte">
    <h2>⚠️ Alles zurücksetzen</h2>
    <div class="zeile">
      <button class="gefahr" onclick="allesLoeschen()">Alle Daten löschen</button>
      ${daten.kunden.length === 0 && daten.auftraege.length === 0 ? `<button class="sekundaer" onclick="beispieldatenLaden()">Beispieldaten laden</button>` : ""}
    </div>
  </div>`;
}

// Branchen-Vorlage in das Preislisten-Feld übernehmen (gespeichert wird erst mit „Speichern“)
function brancheVorlageUebernehmen() {
  const branche = BRANCHEN[document.getElementById("e-branche").value];
  if (!branche) return;
  const feld = document.getElementById("e-preisliste");
  if (feld.value.trim() && !confirm("Die aktuelle Preisliste durch die Vorlage „" + branche.name + "“ ersetzen?")) return;
  feld.value = branche.preisliste.map((p) => p.begriff + " ; " + String(p.preis).replace(".", ",") + " ; " + p.einheit).join("\n");
}

function einstellungenSpeichern() {
  const e = daten.einstellungen;
  e.branche = document.getElementById("e-branche").value;
  e.firma = document.getElementById("e-firma").value.trim();
  e.inhaber = document.getElementById("e-inhaber").value.trim();
  e.strasse = document.getElementById("e-strasse").value.trim();
  e.plzOrt = document.getElementById("e-plzort").value.trim();
  e.telefon = document.getElementById("e-telefon").value.trim();
  e.email = document.getElementById("e-email").value.trim();
  e.iban = document.getElementById("e-iban").value.trim();
  e.steuernummer = document.getElementById("e-steuernummer").value.trim();
  e.mwst = Number(document.getElementById("e-mwst").value) || 0;
  e.zahlungsziel = Number(document.getElementById("e-zahlungsziel").value) || 14;
  e.stundensatz = Number(document.getElementById("e-stundensatz").value) || 0;
  e.kleinunternehmer = document.getElementById("e-kleinunternehmer").checked;
  e.preisliste = document.getElementById("e-preisliste").value.split(/\n/)
    .map((zeile) => {
      const teile = zeile.split(";").map((t) => t.trim());
      if (teile.length < 2 || !teile[0]) return null;
      return { begriff: teile[0], preis: zahlDe(teile[1]) || 0, einheit: teile[2] || "m²" };
    })
    .filter(Boolean);
  e.materialliste = document.getElementById("e-materialliste").value.split(/\n/)
    .map((zeile) => {
      const teile = zeile.split(";").map((t) => t.trim());
      if (teile.length < 2 || !teile[0]) return null;
      return { name: teile[0], preis: zahlDe(teile[1]) || 0, einheit: teile[2] || "Stk." };
    })
    .filter(Boolean);
  const basisFeld = document.getElementById("e-serverbasis");
  if (basisFeld) {
    let basis = basisFeld.value.trim().replace(/\/+$/, "");
    if (basis && !/^https?:\/\//i.test(basis)) basis = "http://" + basis;
    serverBasis = basis;
    localStorage.setItem(SERVER_BASIS_SCHLUESSEL, basis);
    serverAktiv = false;
    if (basis) syncAbgleich();
  }
  speichern();
  render();
  syncAnzeige();
  alert("Einstellungen gespeichert.");
}

function sicherungExportieren() {
  const blob = new Blob([JSON.stringify(daten, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "auftraege-sicherung-" + heuteISO() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function sicherungImportieren(eingabe) {
  const datei = eingabe.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    try {
      const geparst = JSON.parse(leser.result);
      if (!geparst || !Array.isArray(geparst.kunden) || !Array.isArray(geparst.auftraege)) {
        throw new Error("Unerwartetes Format");
      }
      if (!confirm("Achtung: Die aktuelle Datenbank wird durch die Sicherung ersetzt. Fortfahren?")) return;
      daten = Object.assign(leererZustand(), geparst, {
        einstellungen: Object.assign(leererZustand().einstellungen, geparst.einstellungen || {}),
      });
      speichern();
      render();
      alert("Sicherung erfolgreich eingespielt.");
    } catch (err) {
      alert("Diese Datei ist keine gültige Sicherung: " + err.message);
    } finally {
      eingabe.value = "";
    }
  };
  leser.readAsText(datei);
}

function allesLoeschen() {
  if (!confirm("Wirklich ALLE Kunden, Aufträge und Einstellungen löschen?")) return;
  if (!confirm("Letzte Warnung: Ohne Sicherung sind die Daten unwiederbringlich weg. Trotzdem löschen?")) return;
  daten = leererZustand();
  speichern();
  render();
}
